<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" fill="none" stroke="currentColor" stroke-width="1.5" font-family="system-ui, sans-serif" font-size="14">
  <style>svg{color:#1f2328}@media (prefers-color-scheme:dark){svg{color:#e6edf3}}</style>
  <title id="t">A long Secure call blocks the high-priority task and delays the task between them</title>
  <desc id="d">Three lanes over time. The low-priority task runs and then makes a long call into the Secure world. The high-priority task is released during the call and preempts it at once, but when it needs the Secure world too it waits until the call returns. The medium-priority task, which never calls the Secure world, is held back as well, because the low task runs at the high task's priority while it blocks it.</desc>
  <defs><pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke-width="2" opacity=".55"/></pattern></defs>
  <g fill="currentColor" stroke="none">
    <text x="20" y="72">High task</text>
    <text x="20" y="152">Medium task</text>
    <text x="20" y="232">Low task</text>
    <text x="700" y="318" text-anchor="end" opacity=".75">time</text>
  </g>
  <!-- low task -->
  <rect x="170" y="210" width="90" height="34" fill="currentColor" fill-opacity=".10"/>
  <rect x="260" y="210" width="300" height="34" fill="currentColor" fill-opacity=".32"/>
  <rect x="560" y="210" width="90" height="34" fill="currentColor" fill-opacity=".10"/>
  <g fill="currentColor" stroke="none" font-size="13"><text x="215" y="232" text-anchor="middle">Non-Secure</text><text x="410" y="232" text-anchor="middle">Secure call (long)</text></g>
  <!-- high task -->
  <rect x="320" y="50" width="40" height="34" fill="currentColor" fill-opacity=".10"/>
  <rect x="360" y="50" width="200" height="34" fill="url(#h)"/>
  <rect x="360" y="50" width="200" height="34" stroke-dasharray="4 3"/>
  <rect x="560" y="50" width="26" height="34" fill="currentColor" fill-opacity=".32"/>
  <rect x="586" y="50" width="50" height="34" fill="currentColor" fill-opacity=".10"/>
  <g fill="currentColor" stroke="none" font-size="13"><text x="460" y="72" text-anchor="middle" font-weight="600">waits for the Secure world</text></g>
  <path d="M320 24 V48 m-5 -8 l5 8 l5 -8"/>
  <g fill="currentColor" stroke="none" font-size="12"><text x="320" y="16" text-anchor="middle">released: preempts at once</text></g>
  <!-- medium task -->
  <rect x="360" y="138" width="200" height="8" fill="currentColor" fill-opacity=".28" stroke="none"/>
  <rect x="640" y="130" width="70" height="34" fill="currentColor" fill-opacity=".10"/>
  <g fill="currentColor" stroke="none" font-size="13"><text x="460" y="128" text-anchor="middle">ready, but held back</text></g>
  <!-- bracket -->
  <path d="M360 268 V278 H560 V268"/>
  <g fill="currentColor" stroke="none" font-size="13"><text x="460" y="298" text-anchor="middle">blocking: what the analysis has to bound</text></g>
</svg>
