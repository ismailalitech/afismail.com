<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d" fill="none" stroke="currentColor" stroke-width="1.5" font-family="system-ui, sans-serif" font-size="14">
  <style>svg{color:#1f2328}@media (prefers-color-scheme:dark){svg{color:#e6edf3}}</style>
  <title id="t">Blocking of a high-priority task by a long Secure call</title>
  <desc id="d">Two lanes over time. The low-priority task runs, then makes a call into the Secure world that runs for a long time. The high-priority task is released during the call, waits until it returns, and only then runs. The wait is the blocking term.</desc>
  <g fill="currentColor" stroke="none">
    <text x="20" y="62">Low-priority task</text>
    <text x="20" y="182">High-priority task</text>
    <text x="640" y="278" text-anchor="end" opacity=".75">time</text>
  </g>
  <!-- low-priority lane -->
  <rect x="190" y="40" width="130" height="36" fill="currentColor" fill-opacity=".10"/>
  <rect x="320" y="40" width="270" height="36" fill="currentColor" fill-opacity=".30"/>
  <rect x="590" y="40" width="130" height="36" fill="currentColor" fill-opacity=".10"/>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="255" y="62" text-anchor="middle">Non-Secure</text>
    <text x="455" y="62" text-anchor="middle">Secure service (psa_call)</text>
    <text x="655" y="62" text-anchor="middle">Non-Secure</text>
  </g>
  <!-- high-priority lane -->
  <line x1="190" y1="196" x2="720" y2="196" stroke-opacity=".35"/>
  <rect x="590" y="160" width="100" height="36" fill="currentColor" fill-opacity=".10"/>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="640" y="182" text-anchor="middle">runs</text>
    <text x="455" y="226" text-anchor="middle">ready, but cannot run</text>
  </g>
  <!-- release arrow -->
  <path d="M400 120 V158 m-6 -8 l6 8 l6 -8"/>
  <g fill="currentColor" stroke="none" font-size="13"><text x="400" y="112" text-anchor="middle">released</text></g>
  <!-- blocking bracket -->
  <path d="M400 240 V250 H590 V240"/>
  <g fill="currentColor" stroke="none" font-size="13"><text x="495" y="270" text-anchor="middle">blocking: what the analysis has to bound</text></g>
</svg>
