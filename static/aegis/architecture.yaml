# Walks: each step names an edge (played from its start to its end, or back) or a node, and says what happens.
walks:
  - id: attestation
    title: One attestation cycle, from nonce to verdict
    steps:
      - {edge: fleet-policy, say: "aegis-fleet starts a cycle, every 30 s, and reloads the policy: the endpoints, their enrolled keys, the allowed measurements and the pinned profiles."}
      - {edge: stm32-chal, say: "It sends the STM32 a fresh 32-byte nonce: PQCHAL and the nonce in hex, one request per TCP connection."}
      - {edge: stm32-call, say: "The non-secure prover holds no key. It passes the request to the Aegis partition with psa_call."}
      - {edge: stm32-token, say: "The partition asks TF-M's Initial Attestation service for the PSA token with the nonce as challenge."}
      - {edge: stm32-meas, say: "The token carries what BL2 recorded at boot: the measurements of the secure and non-secure images with their signer IDs."}
      - {edge: stm32-key, say: "The partition signs aegis-endpoint-quote-v1, a zero byte and the token with its ML-DSA-65 key, made at start-up from the DHUK. The signature is hedged: fresh randomness every time."}
      - {edge: stm32-chal, back: true, say: "PQTOKEN goes back: on the bench a 515-byte token and a 3,309-byte signature, 0.30 s for the quote."}
      - {edge: fleet-policy, say: "The gateway checks the signature against the enrolled key, the nonce against the one it sent, and every measurement against the policy. Any mismatch is QUARANTINED, with the reason in the journal."}
      - {edge: fleet-enforce, say: "The verdict goes to the enforcement hook, which adds the address to the @admitted set or removes it."}
      - {edge: enforce-lan, say: "On the bench the gateway is not yet in the traffic path: it decides and records. With a VLAN switch the same rules would block a quarantined endpoint."}
  - id: provisioning
    title: ML-KEM provisioning with mutual authentication
    steps:
      - {edge: stm32-kem, say: "Only after ADMITTED, and only without a valid credential: PQKEMINIT and a nonce. A new PQKEMINIT cancels any exchange still pending."}
      - {edge: stm32-call, say: "The prover passes it to the partition."}
      - {node: stm32-s, say: "The partition makes a fresh ML-KEM-768 encapsulation key for this exchange and signs it, with the nonce, using its device key."}
      - {edge: stm32-kem, back: true, say: "PQKEMEK returns the key and the signature. The gateway checks them against the enrolled key, so a key swapped on the way is refused (T6)."}
      - {edge: key-cred, say: "The gateway encapsulates to that key and signs a credential with its own ML-DSA-65 key. The credential names SHA3-256 of the ciphertext, SHA3-256 of the encapsulation key, the endpoint's key, and when it was issued and expires."}
      - {edge: stm32-kem, say: "PQKEMFIN carries the ciphertext and the credential. The one captured on board 2 was 10,073 bytes."}
      - {edge: stm32-call, say: "The prover passes it on; it cannot change anything without breaking a signature."}
      - {node: stm32-s, say: "The partition checks the credential against the gateway key pinned in its secure image, and that it names this ciphertext and this key. Then it decapsulates. A credential from a foreign key, or one for another exchange, gets error -149 and the session stays as it was."}
      - {edge: stm32-kem, back: true, say: "PQKEMOK and a key-confirmation tag. Both sides now keep session = SHA3-256(\"aegis-session-v1\" || K || nonce || SHA3(ct)); the key never leaves either side. The credential lasts an hour and is renewed five minutes before it expires."}
  - id: heartbeat
    title: A heartbeat under the session key
    steps:
      - {edge: stm32-hb, say: "Every cycle while the credential is valid: PQHB and a fresh nonce."}
      - {edge: stm32-call, say: "The prover passes the request with its status text: uptime, link and firmware version."}
      - {edge: stm32-clock, say: "The partition reads its secure clock first. The session is younger than its lifetime plus a sixteenth, so it goes on; the seconds left become ttl."}
      - {node: stm32-s, say: "It appends ;sstack=19088/26624 (its stack high-water mark) and ;ttl= to the status, raises its counter, and computes KMAC256(session, nonce || counter || status, 256, \"aegis-hb-v2\")."}
      - {edge: stm32-hb, back: true, say: "The reply: status, counter and MAC. One from the bench: heartbeat 27 (uptime_s=992;link=1;fw=0.6.0;sstack=19088/26624;ttl=3005)."}
      - {node: fleet, say: "The gateway recomputes the MAC with its copy of the session key and needs the counter to have risen. A failure leads to a new provisioning."}
  - id: tamper
    title: A tampered image quarantined, its credential revoked
    steps:
      - {edge: rw612-meas, say: "The RW612 was flashed with a non-secure image changed by one byte of its banner. At start-up, before that image runs, the partition hashes the whole non-secure partition: NSPE is now dea2a3b37159..."}
      - {edge: rw612-chal, say: "The next cycle sends PQCHAL with a fresh nonce."}
      - {edge: rw612-call, say: "The non-secure prover passes it to the partition. It cannot change the measurement: the partition took it before the prover ran."}
      - {edge: rw612-chal, back: true, say: "The quote is signed validly with the chip's key and carries NSPE dea2a3b37159..."}
      - {edge: fleet-policy, say: "That value is not in the policy. The journal: 06:36:21 frdm-rw612 QUARANTINED (trustzone trust) component NSPE not allowed (measurement dea2a3b37159...) [credential: revoked]"}
      - {edge: fleet-enforce, say: "Quarantine deletes the credential and the session key on the gateway, and the hook removes the endpoint from @admitted."}
      - {edge: rw612-chal, say: "With the good image flashed back: 06:38:17 frdm-rw612 ADMITTED (trustzone trust) [credential: issued session 0a3caec39a2c...], a new session."}
  - id: expiry
    title: A credential that expires on the endpoint
    steps:
      - {edge: stm32-kem, say: "A check on the gateway (tests/board/expiry_check.py, with aegis-fleet stopped) provisions STM32 board 2 with a credential that lasts 32 s."}
      - {edge: stm32-clock, say: "The partition takes the lifetime from the signed credential (expires minus issued) and starts its own clock at the accepted PQKEMFIN. With a sixteenth added, the session ends 34 s later."}
      - {edge: stm32-hb, say: "A heartbeat at once: uptime_s=108;link=1;fw=0.6.0;sstack=19088/26624;ttl=34."}
      - {edge: stm32-hb, back: true, say: "Half-way: ttl=18. From the two values, the endpoint's clock runs at 0.941 s per gateway second, inside the margin a sixteenth gives."}
      - {edge: stm32-clock, say: "After the end, the first request reads the clock, finds the session too old, and wipes the session key and the credential hash."}
      - {edge: stm32-hb, say: "PQHB and PQSESSION now answer ERR pq -140 (the RW612 says ERR pq expired). Without the gateway, the endpoint has ended the session itself."}
      - {edge: stm32-chal, say: "Attestation needs no session: PQCHAL is still answered with PQTOKEN, and the gateway provisions a new session at its next cycle."}
  - id: zynq-boot
    title: The Zynq UltraScale+ secure boot, from the PUF to the TA's key
    steps:
      - {edge: zq-decrypt, say: "At power-on the boot ROM regenerates the PUF's key-encryption key from the helper data in the boot header, decrypts the black key into the device key, and decrypts the FSBL with it. The console says: Secure Boot: authenticated, encrypted."}
      - {edge: zq-load-pmu, say: "The FSBL loads the PMU firmware and hashes it with the CSU's SHA3-384 (PMUFW, 129888 bytes as stored)."}
      - {edge: zq-load-pl, say: "It loads the bitstream with the Aegis accelerator and hashes it (PL, 7797692 bytes)."}
      - {edge: zq-load-tfa, say: "It loads and hashes TF-A, OP-TEE and U-Boot: seven measurements with its own."}
      - {edge: zq-handoff, say: "Before the hand-over its hook derives seed = AES-256-GCM(device key, fixed IV, \"aegis-zynqmp-mldsa65-seed-v1\"), writes the seed and the measurement list to a page in OP-TEE's memory, and clears the AES and KUP key registers. Console: AEGIS: hand-off flags=0x7 meas=7."}
      - {edge: zq-bl32, say: "TF-A's BL31 starts OP-TEE 4.7 as BL32."}
      - {edge: zq-huk, say: "OP-TEE reads the hand-off page once, wipes it and keeps the seed as the hardware unique key. The TA derives its ML-DSA-65 key from it. Console: Aegis TA: key ready, profile aegis-zynqmp-optee-v1 ... 7 measurements."}
      - {edge: zq-normal, say: "Only then the normal world: U-Boot."}
      - {edge: zq-kernel, say: "U-Boot loads Linux 6.12. The kernel is not among the measurements yet."}
      - {edge: zq-call, say: "Linux's bridge carries the gateway's lines to the TA. Its key, sha256 c02f156d..., is the same after a power cycle, and the gateway admits the board: 06:30:35 zynqmp-te0808 ADMITTED (trustzone trust)."}
  - id: gateway-quote
    title: The gateway proves itself to the PC
    steps:
      - {edge: quote, say: "The PC's verifier sends a fresh nonce to aegisd on TCP 7443."}
      - {edge: sysserv, say: "aegisd reads live platform state through the system controller's read-only services: design info, usercode, security locks and design digests. It adds its own code hash, the kernel and the boot id."}
      - {edge: key-quote, say: "It signs the body with the gateway's ML-DSA-65 key, label aegis-quote-v1."}
      - {edge: quote, back: true, say: "The PC checks the signature, the nonce and the measurements. Recorded: accepted, a 3,309-byte signature, 0.039 s."}

