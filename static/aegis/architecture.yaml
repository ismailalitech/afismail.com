# Aegis system architecture: the single source for the architecture explorer at /aegis/explorer/.
# Hugo reads this file when the site is built (layouts/aegis-explorer.html): it draws nothing itself, it hands
# the data to the page and prints the same content as text for readers without JavaScript.
#
# Every fact comes from the Aegis repository (https://github.com/ismailalitech/aegis): docs/architecture.md,
# docs/threat-model.md, docs/zynqmp-key-design.md, docs/endpoint-expiry.md, docs/evidence-format.md,
# docs/audit-and-policy.md, docs/enrolment.md, docs/zynqmp-sdk-port.md, docs/release-notes-1.0.md and -1.1.md,
# endpoints/*/README.md and evidence/, as of 21 November 2026, with Aegis 1.2 (main 6bf5b53) on the gateway. Each component and connection names the files behind it ("sources") and the labs that
# explain it ("learn", paths under /projects/fpga-soc/microchip-polarfire-soc/aegis/; the build fails on a
# missing page).
schema: 1
baseline:
  date: "2026-11-21"
  state: Releases v1.0.0 and v1.1.0, and Aegis 1.2 on the gateway, 21 November 2026
  repo: https://github.com/ismailalitech/aegis

node_kinds:
  group: Board
  host: PC tool
  service: Gateway service
  file: Data on the gateway
  hw: Hardware
  nonsecure: Non-secure software
  secure: Secure-world software
  boot: Boot stage
  network: Network
  legacy: Device that cannot attest

edge_kinds:
  quote: Gateway quote
  attest: Attestation (PQCHAL, PQTOKEN)
  kem: ML-KEM provisioning (PQKEMINIT, PQKEMFIN)
  hb: KMAC heartbeat (PQHB)
  world: Call between worlds
  boot: Boot hand-over
  key: Key material
  measure: Measurement
  enforce: Enforcement hook
  serial: Serial line
  uses: Uses or reads
  record: Signed record

nodes:
  # ---------------------------------------------------------------- the bench PC
  - id: pc
    title: PC on the bench
    kind: group
    summary: On the same LAN as the gateway and the endpoints. Checks the gateway's own quote, relays requests to the Arduino Uno, endorses device keys, signs the gateway's policy with a key sealed to its TPM, and keeps the audit log's anchors where the gateway cannot write.
    sources: [host/, provision/aegis_provision.py, tools/audit_anchors.py]
  - id: verifier
    title: Gateway verifier
    label: aegis_verify.py
    sub: checks the gateway's quote
    kind: host
    parent: pc
    summary: Sends a fresh nonce to the gateway and checks the ML-DSA-65 quote that comes back - the signature, the nonce and the platform measurements.
    facts: {result: "accepted, 3,309-byte signature, 0.039 s", port: "TCP 7443"}
    sources: [host/aegis_verify.py, evidence/console/quote-accepted.json]
    learn: [identity-and-quotes/a02-gateway-identity-and-quote]

  - id: endorser
    title: Endorser
    label: aegis_provision.py endorse
    sub: endorses device keys
    kind: host
    parent: pc
    summary: Asks a device for its key and a quote on a fresh challenge, checks the quote against its own reference list, shows the operator the key's hash and the components, and signs an endorsement record only after a typed yes. Its ML-DSA-65 key is sealed to the PC's TPM.
    facts: {time: "0.566 s, 0.691 s and 0.194 s for the three devices", required_for: "both STM32s, the RW612 and the Zynq UltraScale+", shows: "what this endorser saw on this cable, not that another image cannot use the key"}
    sources: [docs/enrolment.md, evidence/endorsed-enrolment/bench/live-switch.txt]
    learn: [trust-model/x05-trust-labels-endorsement-transcript]
  - id: policy-signer
    title: Policy signer
    label: aegis_provision.py policy-sign
    sub: the operator key, TPM-sealed
    kind: host
    parent: pc
    summary: Signs the gateway's policy with the operator's ML-DSA-65 key, which no verifier holds. Takes the next version from its own ledger, pins the device keys' hashes, prints what it is about to sign and signs only after a typed yes.
    facts: {key: "sealed to the PC's TPM", object: "the policy JSON byte for byte in a COSE_Sign1, typ application/vnd.aegis.fleet-policy+cbor"}
    sources: [docs/audit-and-policy.md, provision/aegis_provision.py]
    learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy]
  - id: anchors
    title: Audit anchors
    label: audit_anchors.py
    sub: keeps batch records off the gateway
    kind: host
    parent: pc
    summary: Fetches the audit log's last batch record over read-only SSH every 300 s and keeps it in a store where files are written once and made read-only; once an hour it copies the whole log and checks it against every anchor kept. Reports a log cut short, written again, with a gap, replaced or rolled back.
    facts: {interval: "fetch every 300 s, check every hour", cannot_see: "what was cut after the last fetch; entries never written"}
    sources: [tools/audit_anchors.py, docs/audit-and-policy.md]
    learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy]
  - id: checkers
    title: Standalone checkers
    label: verify_evidence.py, verify_audit.py
    sub: no Aegis code
    kind: host
    parent: pc
    summary: Check evidence packs, the audit log and signed policies with pycose 1.1.0, cbor2 and OpenSSL 3.5 only. Their claim numbers were written from the format documents, not from the verifier's code. Since Aegis 1.2 verify_evidence.py reports whether a pack's export time is signed (--require-signed-export refuses one that is not), and verify_audit.py --result finds the log's head a result names.
    facts: {does_not: "judge the policy, or check the ES256 signature inside a nested PSA token", stripped: "a pack whose result says aegis.pack-signed and that has no manifest.cose is refused"}
    sources: [tools/verify_evidence.py, tools/verify_audit.py, docs/evidence-format.md]
    learn: [standards-and-releases/x07-standard-evidence, standards-and-releases/a20-attest-a-device-without-hardware, standards-and-releases/x10-aegis-1-2]

  # ---------------------------------------------------------------- the gateway
  - id: gateway
    title: PolarFire SoC Discovery Kit (the gateway)
    kind: group
    summary: Decides which endpoints may be trusted, from evidence the endpoints' secure hardware produces, and gives admitted endpoints a credential and a session key established with ML-KEM. Linux on U54 harts 1 to 3 runs the services.
    facts: {chip: "MPFS095T, the non-S part", network: "one Ethernet port: it decides, it is not yet in the traffic path", regression: "14 of 14 with --with-expiry, three times during the 3-hour soak", soak: "3 h on three boards: 40 of 40 samples, 37 renewals per endpoint, no quarantine or reset"}
    sources: [docs/architecture.md, evidence/console/regression-14of14-20261119.txt, evidence/soak-20261121/NOTE.md, tools/bench_watch.py]
    learn: [identity-and-quotes/k01-chip-is-not-an-s-device, bench-and-reproduce/a01-reproduce-the-bench, bench-and-reproduce/k15-a-gateway-that-hung-for-seven-hours, bench-and-reproduce/k16-a-soak-that-failed-its-own-clock-estimate, standards-and-releases/x09-releases-1-0-and-1-1]
  - id: aegisd
    title: aegisd
    sub: identity and quote
    kind: service
    parent: gateway
    summary: The gateway's identity, bound to the chip's serial number, the Microchip device certificate and the design info. Answers quotes with live platform measurements.
    facts: {port: "TCP 7443, length-prefixed JSON", label: aegis-quote-v1, limits: "a thread per connection, 8 at most, 3 s timeout"}
    sources: [gateway/aegisd/aegisd.py, docs/threat-model.md]
    learn: [identity-and-quotes/a02-gateway-identity-and-quote, attesting-an-endpoint/k04-one-slow-client-stalled-the-service]
  - id: sysctrl
    title: System controller
    sub: serial, certificate, digests, nonce
    kind: hw
    parent: gateway
    summary: A hard block that starts before the processors. Through a read-only whitelist of services it gives the serial number, a certificate Microchip signed for it, design digests and a nonce from the chip's SRAM start-up states.
    facts: {serial: "16 bytes", certificate: "976-byte X.509; status 0, valid and consistent with the device", nonce: "32 bytes"}
    sources: [gateway/sysserv/aegis_sysserv.py, docs/threat-model.md]
    learn: [identity-and-quotes/a02-gateway-identity-and-quote, identity-and-quotes/k01-chip-is-not-an-s-device]
  - id: gw-key
    title: Gateway identity key
    sub: ML-DSA-65, held in software
    kind: file
    parent: gateway
    summary: Signs the gateway's quotes and the endpoints' credentials. A software key, protected by Linux file permissions only - the MPFS095T (non-S) has no key-holding data-security services. Its public half is pinned in each endpoint's secure image at build time.
    facts: {file: "/var/lib/aegis/identity.sk, mode 0600", at_the_endpoint: "pinned in the secure image (gateway_pk.h)"}
    sources: [docs/threat-model.md, endpoints/rw612/README.md]
    learn: [identity-and-quotes/a02-gateway-identity-and-quote, identity-and-quotes/k01-chip-is-not-an-s-device]
  - id: policy
    title: Signed policy
    label: fleet.cose
    sub: keys, measurements, endorsements
    kind: file
    parent: gateway
    summary: The endpoints, their ML-DSA-65 keys, the allowed measurements, the pinned profiles, the endorsement records each entry requires, and whether the transcript, results and the audit log are on. Since 21 November 2026 signed by the operator key on the PC; aegis-fleet checks it against policy-signers.json every cycle and refuses an unsigned file or a lower version. Since Aegis 1.2 an entry can have a floor on its trust label (min_trust) and can be taken out of service without being deleted (disabled).
    facts: {signed: "by a key no verifier holds; a version that never goes back", pins: "device keys by pq_pub_sha256, endorsement records by endorsement_sha256", min_trust: "trustzone > trustzone-devkey > device-key > software > development-shared-key; a floor an entry can never meet is refused when the policy loads, the endpoint not contacted", disabled: "not contacted, quarantined every cycle, session revoked, result incomplete", root_on_the_gateway: "can replace the signers file, cannot sign a new policy"}
    sources: [docs/audit-and-policy.md, docs/enrolment.md, gateway/policy/fleet.example.json]
    learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy, trust-model/x05-trust-labels-endorsement-transcript, standards-and-releases/x10-aegis-1-2, attesting-an-endpoint/a05-quarantine-and-red-team]
  - id: audit
    title: Audit log
    sub: chained batches, one signature each
    kind: file
    parent: gateway
    summary: aegis-fleet's decisions in segment files of batch records, each a COSE_Sign1 by the gateway's identity key naming the hash of the batch before it. An entry is made only when a decision, a session or the policy changes; a steady cycle writes nothing. Since Aegis 1.2 every signed result names the log's last batch at that moment, so a result kept off the gateway is an anchor too.
    facts: {measured: "the directory did not grow over ten minutes (44 KB); eight batches, 43 KB, in the first hour", cost: "about 0.3 MB a day for the bench", limit: "a log cut at a record boundary is found only with an anchor"}
    sources: [docs/audit-and-policy.md, common/audit.py]
    learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy, standards-and-releases/x10-aegis-1-2]
  - id: results
    title: Attestation results
    sub: EAR per verdict, evidence packs
    kind: file
    parent: gateway
    summary: For each verdict an attestation result in the EAR format, signed with the gateway's identity key, beside the evidence as received; replaced every cycle. fleet.py export-evidence writes them with the keys into a pack that the standalone checker verifies. Since Aegis 1.2 the verifier also signs the pack's manifest and export time (manifest.cose), and every result says so (aegis.pack-signed), names the audit log's head and lists the verdict's warnings (aegis.warnings).
    facts: {per_cycle: "evidence.cbor 4,048 bytes, result.cbor 4,529, meta.json 440 for STM32 board 2", status: "affirming, warning, contraindicated or incomplete; never better than the verdict; incomplete for a disabled entry or a floor it can never meet", signed_manifest: "COSE_Sign1 over the endpoint, the export time and the SHA-256 of the manifest and the result", formats: "EAR draft-06 and AR4SI draft-11: IETF drafts"}
    sources: [docs/evidence-format.md, common/eat.py, common/evidence_pack.py, docs/audit-and-policy.md]
    learn: [standards-and-releases/x07-standard-evidence, standards-and-releases/x10-aegis-1-2]
  - id: fleet
    title: aegis-fleet
    sub: attest, decide, provision, every 30 s
    kind: service
    parent: gateway
    summary: Every 30 s it attests each endpoint, admits or quarantines it with a reason, issues or revokes ML-KEM credentials and checks heartbeats. The verdict names the trust behind it.
    facts: {cycle: "30 s", credential: "one hour, renewed five minutes before it expires", trust_labels: "trustzone, trustzone-devkey, device-key, software, development-shared-key (since 1.1)", transcript: "v2 required for every attesting endpoint: the session continues the appraised quote", endorsement: "required for every attesting endpoint"}
    sources: [gateway/aegisd/fleet.py, docs/architecture.md, docs/release-notes-1.1.md]
    learn: [attesting-an-endpoint/a04-attest-the-stm32, attesting-an-endpoint/a05-quarantine-and-red-team, attesting-an-endpoint/a09-harden-a-running-endpoint, trust-model/x01-what-a-device-can-prove, trust-model/x05-trust-labels-endorsement-transcript]
  - id: fabric
    title: Fabric accelerator
    sub: SHA-3 sponge and NTT, version 2
    kind: hw
    parent: gateway
    summary: On FIC3, APB slot 14. Keeps the SHA-3 sponge in the fabric, squeezes blocks by DMA into DDR, and runs the FIPS 203/204 NTT. A performance block, not a security mechanism; the gateway's services do not enable it.
    facts: {speed: "ML-KEM-768 1.26 to 1.29 times, ML-DSA-65 1.19 to 1.54 times faster than software", vectors: "265 of 265 NIST cases", cost: "44,191 logic elements (47.3 %), worst slack 1.329 ns at 125 MHz"}
    sources: [docs/accelerator-v2.md, hw/rtl/, evidence/accel-v2/]
    learn: [post-quantum-in-fabric/a03-fabric-accelerator, post-quantum-in-fabric/a08-sponge-accelerator]
  - id: enforce
    title: Enforcement hook
    sub: aegis-enforce.sh and nftables
    kind: service
    parent: gateway
    summary: Run with the endpoint's name and verdict after every decision. It adds the endpoint's address to the nftables set @admitted or removes it. Tested in network namespaces; on the bench the gateway is not yet in the traffic path, so today it decides and records.
    facts: {namespaces: "13 of 13 checks", one_port_vlan_design: "16 of 16 checks", needs: "a switch with 802.1Q VLANs"}
    sources: [gateway/enforce/aegis-enforce.sh, gateway/enforce/aegis.nft, docs/vlan-enforcement.md, evidence/console/enforcement.txt]
    learn: [enforcement/a07-enforcement-without-a-switch, enforcement/a08-one-port-and-a-vlan-switch, enforcement/k10-the-ruleset-that-let-no-endpoint-in, enforcement/k05-a-kernel-install-that-replaced-lib]
  - id: lan
    title: Bench LAN
    sub: TCP 7443 and 7444
    kind: network
    summary: Every request travels over TCP, one request per connection, hex lines on the endpoint side. The threat model's network attacker can read, drop, replay, modify and inject traffic here, and connect to any open port.
    facts: {gateway: "TCP 7443", endpoints: "TCP 7444"}
    sources: [docs/threat-model.md]
    learn: [trust-model/x01-what-a-device-can-prove]

  # ---------------------------------------------------------------- STM32H573
  - id: stm32
    title: STM32H573I-DK, boards 1 and 2
    kind: group
    stack: 2
    summary: Two boards with the same firmware, option bytes and boot loader. TF-M v2.3.0 with the Aegis partition on the Prover SDK in the secure world, in product state Open with TF-M's published development keys. The gateway knows them as stm32h573-dk and stm32h573-dk-2 (kind aegis-pq), labels them trustzone-devkey since Aegis 1.1, and requires an endorsement and transcript v2 for both. Board 2 sends standard evidence; board 1 was unplugged for the soak.
    facts: {tfm: "v2.3.0, isolation level 1", two_chips: "ML-DSA keys differ in 1,941 of 1,952 bytes", psa_identity: "the same on both (development provisioning)", trust_label: "trustzone-devkey: the PSA token is signed with TF-M's published key"}
    sources: [docs/second-board.md, evidence/two-boards/]
    learn: [attesting-an-endpoint/a04-attest-the-stm32, attesting-an-endpoint/a10-two-chips-two-keys, attesting-an-endpoint/a17-the-stm32-from-the-non-secure-side]
  - id: stm32-ns
    title: STM32 non-secure prover
    label: Non-secure prover
    sub: lwIP, TCP 7444, no keys
    kind: nonsecure
    parent: stm32
    summary: Ethernet (lwIP, LAN8742A) and the line protocol. Holds no keys. Passes each request to the secure partition with psa_call, and gives it the status text (uptime, link, firmware) that a heartbeat carries.
    facts: {version: "0.6.0; board 2 built with the EAT option, NSPE acf8fc53"}
    sources: [endpoints/stm32h573/prover-ns/, endpoints/stm32h573/README.md]
    learn: [attesting-an-endpoint/a04-attest-the-stm32, attesting-an-endpoint/k02-veneers-at-different-addresses]
  - id: stm32-s
    title: STM32 Aegis PQ partition
    label: Aegis PQ partition
    sub: TF-M secure partition
    kind: secure
    parent: stm32
    summary: The device key, quotes, ML-KEM provisioning, mutual authentication and KMAC heartbeats, since 20 November 2026 from the Prover SDK's core with this file as its platform layer. Derives its ML-DSA-65 key from the DHUK at start-up and checks every credential against the gateway key pinned in its image. Ends a session on its own secure clock. On board 2 it also answers QUOTE_EAT with an EAT in a COSE_Sign1 that nests the PSA token.
    facts: {image: "SPE 9de76167 (board 1); SPE 315dcc2f with the EAT option (board 2)", stack: "18872 of 26624 bytes used (sstack= in every heartbeat)", session_end: "lifetime plus a sixteenth, then ERR pq -140", eat_cost: "secure RAM +736 bytes, code +1,440 bytes"}
    sources: [endpoints/stm32h573/tfm-aegis-partition/aegis_pq_attest.c, sdk/src/aegis_proto.c, evidence/sdk-core/summary.txt, evidence/soak-20261121/NOTE.md, docs/evidence-format.md]
    learn: [attesting-an-endpoint/a04-attest-the-stm32, attesting-an-endpoint/a09-harden-a-running-endpoint, attesting-an-endpoint/a17-the-stm32-from-the-non-secure-side, attesting-an-endpoint/k03-anyone-could-end-a-session, attesting-an-endpoint/k09-a-refused-key-exchange-left-half-of-one, standards-and-releases/x06-one-prover-sdk, standards-and-releases/x07-standard-evidence]
  - id: stm32-ias
    title: Initial Attestation service
    label: Initial Attestation
    sub: PSA token, signed ES256
    kind: secure
    parent: stm32
    summary: TF-M's own service. Gives the partition the PSA token (COSE_Sign1) with the challenge, the instance ID and the boot measurements of SPE and NSPE with their signer IDs. Its ES256 key is TF-M's published development key; only the ML-DSA signature from the device key counts.
    sources: [docs/threat-model.md, docs/architecture.md]
    learn: [trust-model/x03-measured-boot-and-the-token, attesting-an-endpoint/a04-attest-the-stm32]
  - id: stm32-bl2
    title: TF-M BL2 (MCUboot)
    sub: verifies and measures the images
    kind: boot
    parent: stm32
    summary: Verifies the signatures of the secure and non-secure images (EC-P256) and records their measurements, which the PSA token then carries. On this bench the images are signed with TF-M's published development keys.
    facts: {signer: "TF-M development keys", product_state: "Open"}
    sources: [docs/threat-model.md]
    learn: [trust-model/x03-measured-boot-and-the-token, attesting-an-endpoint/a04-attest-the-stm32]
  - id: stm32-saes
    title: SAES with the DHUK
    sub: the chip's hardware-unique key
    kind: hw
    parent: stm32
    summary: At partition start-up the secure world encrypts a fixed 32-byte label with AES-256 in SAES under the hardware-unique key. The result seeds ML-DSA-65 key generation and is then wiped. The GTZC makes SAES secure-only.
    facts: {probe: "the derivation run from the non-secure side is refused (TZIC SR3 bit 19, SAES)", second_chip: "same firmware, different key"}
    sources: [evidence/stm32-tz/tz-probes.txt, docs/second-board.md]
    learn: [attesting-an-endpoint/a04-attest-the-stm32, attesting-an-endpoint/a10-two-chips-two-keys, attesting-an-endpoint/a17-the-stm32-from-the-non-secure-side]
  - id: stm32-rtc
    title: RTC on the LSI
    sub: the secure session clock
    kind: hw
    parent: stm32
    summary: The clock that ends a session on the endpoint. The RTC runs on the internal 32 kHz RC oscillator as a 32-bit counter at 250 Hz; the partition makes it secure and privileged at each start and checks the settings at every reading.
    facts: {rate_on_the_bench: "0.941 s per gateway second, on both boards", wraps: "every 198 days"}
    sources: [docs/endpoint-expiry.md, evidence/endpoint-expiry/bench.txt]

  # ---------------------------------------------------------------- RW612
  - id: rw612
    title: NXP FRDM-RW612
    kind: group
    summary: A Cortex-M33 at 260 MHz with TrustZone and the EdgeLock Secure Subsystem (ELS). NXP's TF-M v2.1.4 with the Aegis prover in a secure partition; the non-secure image only carries the network. Known to the gateway as frdm-rw612, kind aegis-device. No secure boot is fused.
    facts: {tfm_regression: "164 of 164 tests, 16 of 16 suites", isolation: "TF-M level 2", protected_blocks: "12, each faults on a non-secure read"}
    sources: [endpoints/rw612/README.md, endpoints/rw612/tfm/README.md, evidence/rw612-tfm/tfm-regression-164.txt, evidence/rw612-tfm/hardening-probes.txt]
    learn: [attesting-an-endpoint/a11-a-key-from-the-chip-on-the-rw612, attesting-an-endpoint/a12-trustzone-on-the-rw612]
  - id: rw612-ns
    title: RW612 non-secure network prover
    label: Non-secure prover
    sub: lwIP, TCP 7444, no key
    kind: nonsecure
    parent: rw612
    summary: Passes each line to the Aegis partition with psa_call, one line in and one out. It never holds the key, the seed or the session, and it cannot reach ELS.
    facts: {version: "0.2.2 (NSPE 24979a1f)"}
    sources: [endpoints/rw612/tfm/prover_ns/, evidence/rw612-tfm/trustzone-prover.txt]
    learn: [attesting-an-endpoint/a12-trustzone-on-the-rw612]
  - id: rw612-pq
    title: RW612 aegis_pq partition
    label: aegis_pq partition
    sub: PSA-RoT, SID 0xAE10
    kind: secure
    parent: rw612
    summary: Runs the Prover SDK's core on every line since secure image 0.3.x. Before the non-secure image runs it hashes the whole secure (SPE) and non-secure (NSPE) flash partitions; at the first request it derives the ML-DSA-65 key from ELS.
    facts: {image: "0.3.2, SPE c8d0f012", measures: "SHA-256 of SPE 0x18001000-0x1809FFFF and NSPE 0x180A0000-0x1839FFFF", profile: aegis-rw612-tfm-v1, stack: "19176 of 32768 bytes during the soak", secure_ram: "176,924 to 161,828 bytes with the SDK"}
    sources: [endpoints/rw612/tfm/aegis_pq/aegis_pq.c, endpoints/rw612/prover/src/aegis_proto.c, evidence/rw612-tfm/upgrade-0.2.1.txt, evidence/rw612-tfm/fuzzing.txt]
    learn: [attesting-an-endpoint/a12-trustzone-on-the-rw612, attesting-an-endpoint/k07-els-before-tf-m-set-it-up, attesting-an-endpoint/k08-a-range-erase-that-left-an-old-image, attesting-an-endpoint/k09-a-refused-key-exchange-left-half-of-one, standards-and-releases/x06-one-prover-sdk]
  - id: rw612-els
    title: ELS and the die key
    sub: from the PUF, CKDF only
    kind: hw
    parent: rw612
    summary: The die master key sits in ELS slots 0 and 1, loaded by the boot ROM from the PUF; software can never read it. CKDF from it, then HMAC-SHA256 with a fixed label, gives the ML-DSA-65 seed; the intermediate key is deleted. TF-M makes ELS reachable by secure privileged code only.
    facts: {key: "sha256(pk) starts dddd6ba1, the same as the single-image prover's: bound to the chip, not the firmware"}
    sources: [endpoints/rw612/README.md, endpoints/rw612/tfm/README.md]
    learn: [attesting-an-endpoint/a11-a-key-from-the-chip-on-the-rw612, attesting-an-endpoint/k06-an-els-key-in-the-last-slot, attesting-an-endpoint/k07-els-before-tf-m-set-it-up]
  - id: rw612-systick
    title: Secure SysTick
    sub: the secure session clock
    kind: hw
    parent: rw612
    summary: The clock that ends a session. The secure SysTick counts the SysTick function clock (main clock / 256, about 1 MHz). Its registers are banked per security state and its clock settings are secure-only. A heartbeat says which clock runs, clk=ref, or clk=cpu in the fallback.
    facts: {rate_on_the_bench: "1.000 s per gateway second (clk=ref)"}
    sources: [docs/endpoint-expiry.md, evidence/endpoint-expiry/bench.txt]

  # ---------------------------------------------------------------- Zynq UltraScale+
  - id: zynqmp
    title: Trenz TE0807, Zynq UltraScale+ XCZU4EG
    label: Zynq UltraScale+ (TE0807)
    kind: group
    summary: On a TEBF0808 carrier. A boot chain built from source, OP-TEE holding the key since 18 November 2026, since 19 November a key bound to the chip's PUF, without writing a fuse, and since 20 November the trusted application on the Prover SDK, with a session bound to its quote and an endorsed key. Known to the gateway as zynqmp-te0808, kind aegis-tee, trust label trustzone.
    facts: {idcode: "04721093 (XCZU4EG)", trust_over_time: "software, then development-shared-key (printed trustzone-devkey before Aegis 1.1), then trustzone", not_yet: "phase C: keeping Linux away from the device key and OP-TEE's memory"}
    sources: [endpoints/zynqmp/README.md, docs/zynqmp-key-design.md, evidence/zynqmp/]
    learn: [zynq-ultrascale-endpoint/a13-a-linux-board-with-software-trust, zynq-ultrascale-endpoint/a14-our-boot-chain-and-the-accelerator, zynq-ultrascale-endpoint/a15-optee-holds-the-key, zynq-ultrascale-endpoint/a16-a-key-from-the-puf, zynq-ultrascale-endpoint/a19-the-trusted-application-on-the-sdk]
  - id: zq-bridge
    title: Linux bridge
    sub: TCP 7444 to /dev/tee0
    kind: nonsecure
    parent: zynqmp
    summary: One line in, one line out, between TCP 7444 and the trusted application through /dev/tee0. Linux holds no key and takes no measurement. Before OP-TEE, a Linux prover with its key in a file ran here (software trust).
    sources: [endpoints/zynqmp/optee/bridge/, evidence/zynqmp/optee-phase-a.txt]
    learn: [zynq-ultrascale-endpoint/a15-optee-holds-the-key, zynq-ultrascale-endpoint/a13-a-linux-board-with-software-trust]
  - id: zq-ta
    title: Aegis trusted application
    label: Aegis TA
    sub: in OP-TEE
    kind: secure
    parent: zynqmp
    summary: Version 0.2.0 is the Prover SDK's core with an OP-TEE platform layer. Its ML-DSA-65 key derives from the hardware unique key; its quotes carry the boot chain's measurements; it runs the ML-KEM exchange bound to the quote (transcript v2) and the KMAC heartbeats. Built into OP-TEE as an early TA, not loaded from Linux, so a TA signed with OP-TEE's public development key cannot take its UUID.
    facts: {version: "0.2.0 (TEE 011989d7..., 576,984 bytes)", profile: aegis-zynqmp-optee-v1, key: "sha256 c02f156d..., the same after a power cycle and after the move to 0.2.0", measurements: "7: PMUFW, FSBL, PL, TFA, TFA.1, TEE, UBOOT", session_end: "on OP-TEE's clock at protection level 1000; tested on the PC stand-in"}
    sources: [endpoints/zynqmp/optee/ta/, docs/zynqmp-sdk-port.md, evidence/zynqmp/puf-phase-b.txt]
    learn: [zynq-ultrascale-endpoint/a15-optee-holds-the-key, zynq-ultrascale-endpoint/a16-a-key-from-the-puf, zynq-ultrascale-endpoint/a19-the-trusted-application-on-the-sdk]
  - id: zq-optee
    title: OP-TEE 4.7
    sub: secure memory from 0x6000_0000
    kind: secure
    parent: zynqmp
    summary: A platform hook reads the FSBL's hand-off page once, wipes it and keeps the seed as the hardware unique key (HUK); every key derives from it. The device tree withholds 0x6000_0000-0x7FFF_FFFF from Linux.
    facts: {random_numbers: "a software generator seeded from a timer (open, phase C)", memory_guard: "the device tree only, until the XMPU guards it (phase C)"}
    sources: [docs/zynqmp-key-design.md, endpoints/zynqmp/optee/os-patches/, evidence/zynqmp/optee-phase-a.txt]
    learn: [zynq-ultrascale-endpoint/a15-optee-holds-the-key, zynq-ultrascale-endpoint/a16-a-key-from-the-puf, zynq-ultrascale-endpoint/k11-tee-elf-without-its-init-data]
  - id: zq-tfa
    title: TF-A BL31
    sub: xilinx-v2025.2, SPD=opteed
    kind: secure
    parent: zynqmp
    summary: TF-A v2.12 built with SPD=opteed. Starts OP-TEE as BL32, then the normal world.
    sources: [endpoints/zynqmp/README.md, evidence/zynqmp/optee-phase-a.txt]
    learn: [zynq-ultrascale-endpoint/a14-our-boot-chain-and-the-accelerator, zynq-ultrascale-endpoint/a15-optee-holds-the-key]
  - id: zq-fsbl
    title: FSBL with the Aegis hook
    sub: Vitis 2025.2, encrypted
    kind: boot
    parent: zynqmp
    summary: Decrypted by the boot ROM with the device key. Loads the PMU firmware, the bitstream, TF-A, OP-TEE and U-Boot, hashing each with the CSU's SHA3-384. Its hook then derives a seed with AES-256-GCM under the device key, writes it with the measurement list to a hand-off page in OP-TEE's memory, and clears the AES and KUP key registers.
    facts: {seed: "AES-256-GCM(device key, fixed IV, \"aegis-zynqmp-mldsa65-seed-v1\")", console: "AEGIS: hand-off flags=0x7 meas=7"}
    sources: [endpoints/zynqmp/fsbl/, docs/zynqmp-key-design.md, evidence/zynqmp/puf-phase-b.txt]
    learn: [zynq-ultrascale-endpoint/a16-a-key-from-the-puf, zynq-ultrascale-endpoint/a14-our-boot-chain-and-the-accelerator]
  - id: zq-pmufw
    title: PMU firmware
    sub: measured as PMUFW
    kind: boot
    parent: zynqmp
    summary: Vitis 2025.2 zynqmp_pmufw, loaded and measured by the boot chain. By default it serves AES with the device key to Linux; building it with those calls secure-only is phase C.
    facts: {measured: "129888 bytes, as stored (encrypted)"}
    sources: [docs/zynqmp-key-design.md, evidence/zynqmp/puf-phase-b.txt]
    learn: [zynq-ultrascale-endpoint/a16-a-key-from-the-puf]
  - id: zq-pl
    title: PL bitstream
    sub: the Aegis accelerator, measured as PL
    kind: hw
    parent: zynqmp
    summary: The Aegis accelerator in the PL at 100 MHz, registers at 0x8000_0000, DMA into DDR. It passes its self-test, and is not faster than the A53 in software at this interface.
    facts: {measured: "7797692 bytes", self_test: "500 iterations each, 0 mismatches", timing: "WNS +3.159 ns"}
    sources: [evidence/zynqmp/pl-accelerator.txt, evidence/zynqmp/puf-phase-b.txt]
    learn: [zynq-ultrascale-endpoint/a14-our-boot-chain-and-the-accelerator]
  - id: zq-puf
    title: PUF and boot ROM
    sub: black key to device key
    kind: hw
    parent: zynqmp
    summary: The PUF is registered in boot-header mode - the helper data and the black key (a key we chose, encrypted under the PUF's key-encryption key) live in the boot header, not in eFUSEs. At power-on the boot ROM regenerates the KEK, decrypts the black key into the AES engine's device key and decrypts the FSBL. Another chip regenerates another KEK and gets a wrong key.
    facts: {efuses: "44 eFUSE cache registers identical before and after", boot: "Secure Boot: authenticated, encrypted", limit: "RSA_EN not fused: the boot ROM does not check who signed the image"}
    sources: [evidence/zynqmp/puf-phase-b.txt, docs/zynqmp-key-design.md]
    learn: [zynq-ultrascale-endpoint/a16-a-key-from-the-puf, zynq-ultrascale-endpoint/k13-a-factory-bit-stopped-the-puf-guard, zynq-ultrascale-endpoint/k14-bootgen-2025-2-fails-on-rsa-keys]
  - id: zq-uboot
    title: U-Boot
    sub: xilinx-v2025.2, no environment
    kind: nonsecure
    parent: zynqmp
    summary: Boots boot.scr from the SD card. Keeps no environment and has the eMMC and QSPI disabled, so it writes neither.
    sources: [endpoints/zynqmp/README.md, evidence/zynqmp/boot-chain.txt]
    learn: [zynq-ultrascale-endpoint/a14-our-boot-chain-and-the-accelerator]
  - id: zq-linux
    title: Linux 6.12
    sub: Debian 12, not measured yet
    kind: nonsecure
    parent: zynqmp
    summary: linux-xlnx xilinx-v2025.2 with OP-TEE support. The kernel that U-Boot loads is not yet among the measurements - OP-TEE takes and wipes the hand-off page before U-Boot runs.
    sources: [docs/zynqmp-key-design.md, evidence/zynqmp/boot-chain.txt]
    learn: [zynq-ultrascale-endpoint/a14-our-boot-chain-and-the-accelerator, zynq-ultrascale-endpoint/k12-a-jtag-boot-after-linux-stalled]

  # ---------------------------------------------------------------- the Prover SDK
  - id: sdk
    title: Prover SDK core
    label: Prover SDK, aegis_proto.c
    sub: one protocol source, API version 1
    kind: secure
    summary: Since 20 November 2026 every endpoint builds one protocol source, the core of the Prover SDK (release 1.0.0, API version 1) - the quote, the exchange, the transcript, the heartbeat and the session's end - with a platform file per chip. It allocates nothing and includes nothing of TF-M, OP-TEE or a vendor HAL. Standard evidence is an option of it, off by default.
    facts: {golden: "31 of 31 STM32 and 18 of 18 line-protocol traces equal to the images before it", code: "32.8 KB on a Cortex-M33 (34.5 KB with the EAT option)", context: "13,232 bytes", ports: "STM32H573 and RW612 (TF-M), Zynq UltraScale+ (OP-TEE), Linux, the PC"}
    sources: [sdk/, docs/sdk-porting-guide.md, docs/sdk-versioning.md, evidence/sdk-core/summary.txt]
    learn: [standards-and-releases/x06-one-prover-sdk, standards-and-releases/a20-attest-a-device-without-hardware]

  # ---------------------------------------------------------------- the legacy node
  - id: legacy
    title: Arduino Uno R3 on a PC relay
    label: Arduino Uno on a relay
    kind: group
    summary: A device that cannot attest - no keys, no measured boot, no network. The gateway reaches it through a relay on the PC and must refuse it on every cycle.
    sources: [endpoints/arduino-uno/legacy_sensor/legacy_sensor.ino, host/serial_bridge.py]
    learn: [attesting-an-endpoint/a05-quarantine-and-red-team]
  - id: relay
    title: Serial relay
    sub: serial_bridge.py on the PC
    kind: host
    parent: legacy
    summary: The gateway connects to the PC on TCP 7444 as it would to a device; the relay forwards one request line to the board's serial port and returns the reply. It adds no trust.
    sources: [host/serial_bridge.py]
    learn: [attesting-an-endpoint/a05-quarantine-and-red-team]
  - id: uno
    title: Arduino Uno R3
    sub: no keys, no measured boot
    kind: legacy
    parent: legacy
    summary: Answers every request line with a statement that it cannot attest. Quarantined on every cycle.
    facts: {reply: "LEGACY-SENSOR uno v1 cannot attest; request was: ...", policy_kind: psa}
    sources: [endpoints/arduino-uno/legacy_sensor/legacy_sensor.ino, gateway/policy/fleet.example.json, evidence/console/two-endpoints-demo.txt]
    learn: [attesting-an-endpoint/a05-quarantine-and-red-team]

edges:
  # the gateway and the PC
  - {id: quote, from: verifier, to: aegisd, kind: quote, label: "quote request: nonce to ML-DSA-65 quote", detail: "Length-prefixed JSON on TCP 7443. The body holds the nonce, the identity hash and the measurements (design info, usercode, security locks, design digests, aegisd code hash, kernel, boot id); the signature is ML-DSA-65 with the label aegis-quote-v1.", learn: [identity-and-quotes/a02-gateway-identity-and-quote]}
  - {id: sysserv, from: aegisd, to: sysctrl, kind: uses, label: "read-only whitelist of system services", detail: "Serial number, device certificate, design digests and the nonce. The kernel module is never unloaded (a kernel hazard)."}
  - {id: key-quote, from: gw-key, to: aegisd, kind: key, label: "signs the gateway's quotes"}
  - {id: key-cred, from: gw-key, to: fleet, kind: key, label: "signs the endpoints' credentials", detail: "A credential names SHA3-256 of the ML-KEM ciphertext, SHA3-256 of the endpoint's encapsulation key, the endpoint's key and its validity (issued, expires)."}
  - {id: fleet-policy, from: fleet, to: policy, kind: uses, label: "reloads the policy every cycle"}
  - {id: fleet-fabric, from: fleet, to: fabric, kind: uses, label: "optional SHA-3 provider for liboqs, which the services do not switch on", detail: "AEGIS_PQC_SPONGE=hw selects the fabric; aegisd and aegis-fleet run in software."}
  - {id: fleet-enforce, from: fleet, to: enforce, kind: enforce, label: "endpoint name and verdict after every decision", learn: [enforcement/a07-enforcement-without-a-switch]}
  - {id: enforce-lan, from: enforce, to: lan, kind: enforce, label: "the @admitted set, not yet in the traffic path", detail: "With a switch carrying 802.1Q VLANs the gateway would sit between the endpoints and the network; the design is tested in network namespaces (16 of 16).", learn: [enforcement/a08-one-port-and-a-vlan-switch]}

  # the protocol to each endpoint
  - {id: stm32-chal, from: fleet, to: stm32-ns, kind: attest, label: "PQCHAL nonce, answered by PQTOKEN", detail: "The claims are the TF-M PSA token, signed with ML-DSA-65 by the device key over aegis-endpoint-quote-v1, a zero byte and the token.", learn: [attesting-an-endpoint/a04-attest-the-stm32]}
  - {id: stm32-kem, from: fleet, to: stm32-ns, kind: kem, label: "PQKEMINIT and PQKEMFIN, answered by PQKEMEK and PQKEMOK", learn: [attesting-an-endpoint/a04-attest-the-stm32, attesting-an-endpoint/k03-anyone-could-end-a-session, attesting-an-endpoint/k09-a-refused-key-exchange-left-half-of-one]}
  - {id: stm32-hb, from: fleet, to: stm32-ns, kind: hb, label: "PQHB nonce, answered with status, counter and KMAC", detail: "Status ends with ;sstack=19088/26624 and ;ttl= the seconds left.", learn: [attesting-an-endpoint/a09-harden-a-running-endpoint]}
  - {id: rw612-chal, from: fleet, to: rw612-ns, kind: attest, label: "PQCHAL nonce, answered by PQTOKEN", detail: "CBOR claims with PSA claim numbers: profile aegis-rw612-tfm-v1, the challenge, the instance ID, and the SPE and NSPE components.", learn: [attesting-an-endpoint/a12-trustzone-on-the-rw612]}
  - {id: rw612-kem, from: fleet, to: rw612-ns, kind: kem, label: "PQKEMINIT and PQKEMFIN, answered by PQKEMEK and PQKEMOK", learn: [attesting-an-endpoint/k09-a-refused-key-exchange-left-half-of-one]}
  - {id: rw612-hb, from: fleet, to: rw612-ns, kind: hb, label: "PQHB nonce, answered with status, counter and KMAC", detail: "The partition writes stack=, clk= and ttl= into its own status.", learn: [attesting-an-endpoint/a12-trustzone-on-the-rw612]}
  - {id: zq-chal, from: fleet, to: zq-bridge, kind: attest, label: "PQCHAL nonce, answered by PQTOKEN", detail: "Profile aegis-zynqmp-optee-v1, with the seven measurements the boot chain took.", learn: [zynq-ultrascale-endpoint/a16-a-key-from-the-puf]}
  - {id: zq-kem, from: fleet, to: zq-bridge, kind: kem, label: "PQKEMINIT and PQKEMFIN, answered by PQKEMEK and PQKEMOK", learn: [zynq-ultrascale-endpoint/a15-optee-holds-the-key]}
  - {id: zq-hb, from: fleet, to: zq-bridge, kind: hb, label: "PQHB nonce, answered with status, counter and KMAC", learn: [zynq-ultrascale-endpoint/a15-optee-holds-the-key]}
  - {id: uno-chal, from: fleet, to: relay, kind: attest, label: "token request", detail: "The Uno answers with a statement that it cannot attest, so the gateway finds no token: QUARANTINED.", learn: [attesting-an-endpoint/a05-quarantine-and-red-team]}
  - {id: uno-serial, from: relay, to: uno, kind: serial, label: "one request line over USB serial"}

  # between the worlds
  - {id: stm32-call, from: stm32-ns, to: stm32-s, kind: world, label: "psa_call", detail: "Non-secure code can ask for quotes, provisioning and heartbeats, and never reads a key.", learn: [attesting-an-endpoint/k02-veneers-at-different-addresses, attesting-an-endpoint/a17-the-stm32-from-the-non-secure-side]}
  - {id: rw612-call, from: rw612-ns, to: rw612-pq, kind: world, label: "psa_call, one line in and one out", learn: [attesting-an-endpoint/a12-trustzone-on-the-rw612]}
  - {id: zq-call, from: zq-bridge, to: zq-ta, kind: world, label: "TEE call through /dev/tee0", learn: [zynq-ultrascale-endpoint/a15-optee-holds-the-key]}

  # inside the STM32
  - {id: stm32-key, from: stm32-saes, to: stm32-s, kind: key, label: "AES-256 of a fixed label under the DHUK: the ML-DSA-65 seed", learn: [attesting-an-endpoint/a04-attest-the-stm32]}
  - {id: stm32-clock, from: stm32-rtc, to: stm32-s, kind: uses, label: "session clock, read at every request"}
  - {id: stm32-token, from: stm32-s, to: stm32-ias, kind: world, label: "psa_call: the PSA token with the challenge", learn: [trust-model/x03-measured-boot-and-the-token]}
  - {id: stm32-meas, from: stm32-bl2, to: stm32-ias, kind: measure, label: "boot records: SPE and NSPE with signer IDs", learn: [trust-model/x03-measured-boot-and-the-token]}

  # inside the RW612
  - {id: rw612-key, from: rw612-els, to: rw612-pq, kind: key, label: "CKDF and HMAC: the ML-DSA-65 seed, at the first request", learn: [attesting-an-endpoint/a11-a-key-from-the-chip-on-the-rw612]}
  - {id: rw612-clock, from: rw612-systick, to: rw612-pq, kind: uses, label: "session clock, read at every request"}
  - {id: rw612-meas, from: rw612-pq, to: rw612-ns, kind: measure, label: "SHA-256 of the whole non-secure partition, before it runs", detail: "The partition hashes its own secure partition (SPE) the same way.", learn: [attesting-an-endpoint/a12-trustzone-on-the-rw612]}

  # inside the Zynq UltraScale+
  - {id: zq-decrypt, from: zq-puf, to: zq-fsbl, kind: boot, label: "the device key decrypts the FSBL", learn: [zynq-ultrascale-endpoint/a16-a-key-from-the-puf]}
  - {id: zq-load-pmu, from: zq-fsbl, to: zq-pmufw, kind: boot, label: "loads and hashes it (PMUFW)"}
  - {id: zq-load-pl, from: zq-fsbl, to: zq-pl, kind: boot, label: "loads and hashes the bitstream (PL)"}
  - {id: zq-load-tfa, from: zq-fsbl, to: zq-tfa, kind: boot, label: "loads and hashes TF-A, OP-TEE and U-Boot, then hands over to BL31"}
  - {id: zq-handoff, from: zq-fsbl, to: zq-optee, kind: key, label: "seed and seven measurements in the hand-off page", learn: [zynq-ultrascale-endpoint/a16-a-key-from-the-puf]}
  - {id: zq-bl32, from: zq-tfa, to: zq-optee, kind: boot, label: "starts OP-TEE as BL32"}
  - {id: zq-huk, from: zq-optee, to: zq-ta, kind: key, label: "hardware unique key: the TA's ML-DSA-65 key derives from it", learn: [zynq-ultrascale-endpoint/a16-a-key-from-the-puf]}
  - {id: zq-normal, from: zq-tfa, to: zq-uboot, kind: boot, label: "the normal world: U-Boot"}
  - {id: zq-kernel, from: zq-uboot, to: zq-linux, kind: boot, label: "loads Linux 6.12, not measured yet"}
  - {id: zq-runs, from: zq-linux, to: zq-bridge, kind: uses, label: "runs the bridge"}

  # signed records, the SDK and the PC's tools
  - {id: sdk-stm32, from: sdk, to: stm32-s, kind: uses, label: "built into the TF-M partition", learn: [standards-and-releases/x06-one-prover-sdk]}
  - {id: sdk-rw612, from: sdk, to: rw612-pq, kind: uses, label: "built into the TF-M partition", learn: [standards-and-releases/x06-one-prover-sdk]}
  - {id: sdk-zq, from: sdk, to: zq-ta, kind: uses, label: "built into the trusted application", learn: [zynq-ultrascale-endpoint/a19-the-trusted-application-on-the-sdk]}
  - {id: stm32-eat, from: fleet, to: stm32-s, kind: attest, views: [records], label: "PQEAT challenge, answered by an EAT in a COSE_Sign1", detail: "Board 2 only. The non-secure prover forwards it as the PSA message QUOTE_EAT; the EAT nests TF-M's PSA token and is signed with ML-DSA-65, COSE algorithm -49. On the bench 4,048 bytes.", learn: [standards-and-releases/x07-standard-evidence]}
  - {id: fleet-results, from: fleet, to: results, kind: record, label: "a signed attestation result for every verdict", detail: "EAR claims with the AR4SI trustworthiness vector, the policy's hash, the evidence's hash, the quote hash of the transcript, the trust label and the enrolment; since 1.2 also aegis.pack-signed, aegis.warnings, the audit log's head and, where the policy sets them, aegis.min-trust and aegis.disabled.", learn: [standards-and-releases/x07-standard-evidence, standards-and-releases/x10-aegis-1-2]}
  - {id: result-head, from: results, to: audit, kind: uses, views: [records], label: "each result names the log's last batch", detail: "Aegis 1.2: aegis.audit-log, aegis.audit-batch and aegis.audit-head, the batch written before the result; the result's own decision goes into a later batch. verify_audit.py --result finds it byte for byte.", learn: [standards-and-releases/x10-aegis-1-2]}
  - {id: fleet-audit, from: fleet, to: audit, kind: record, label: "a signed batch when a decision, a session or the policy changes", detail: "At most one batch per 300 s; an empty one every hour; nothing in a steady cycle.", learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy]}
  - {id: sign-policy, from: policy-signer, to: policy, kind: record, label: "a signed policy, version never lower", detail: "Deployed with fleet.py check first; the loop reloads it at its next cycle.", learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy]}
  - {id: endorse, from: endorser, to: policy, kind: record, label: "an endorsement record, pinned by its hash", detail: "The endorser asks the device for PQKEY and a quote first; the record names one device, its family, one key and the components it reported.", learn: [trust-model/x05-trust-labels-endorsement-transcript]}
  - {id: anchor-fetch, from: anchors, to: audit, kind: uses, label: "fetches the last batch record every 300 s", learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy]}
  - {id: check-pack, from: checkers, to: results, kind: uses, label: "checks an exported evidence pack and its signed export time", learn: [standards-and-releases/x07-standard-evidence, standards-and-releases/a20-attest-a-device-without-hardware, standards-and-releases/x10-aegis-1-2]}
  - {id: check-log, from: checkers, to: audit, kind: uses, label: "checks the log against the anchors kept", learn: [standards-and-releases/x08-a-signed-audit-log-and-a-signed-policy]}

