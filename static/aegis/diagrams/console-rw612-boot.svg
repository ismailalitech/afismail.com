<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" role="img" aria-labelledby="t d">
<title id="t">the FRDM-RW612 starting the Aegis prover</title><desc id="d">The FRDM-RW612 console after a reset: Zephyr starts the prover, which lists the keys the boot ROM left in ELS (the die master key in slots 0 and 1, other ROM keys in 2, 3, 6 and 7), derives its ML-DSA-65 key from the die key, hashes its own image, sets a MAC address from the key, brings the Ethernet link up, gets an address and listens on port 7444.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="464" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="394" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">the FRDM-RW612 starting the Aegis prover</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">board console (USB serial), after a reset</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">*** Booting Zephyr OS build v4.5.0 ***</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">AEGIS-RW612-PROVER 0.1.0</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">els slot  0: props 0x60010161</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">els slot  1: props 0x60010121</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">els slot  2: props 0x88000320</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">els slot  3: props 0x001000a0</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">els slot  6: props 0x800100e1</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">els slot  7: props 0x800100a1</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">aegis: key sha256 219414c54e7bbf34..., image 146308 bytes, sha256 864ac72280f7200b...</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">aegis: mac 02:ae:dd:dd:6b:a1</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">phy_mc_ksz8081: PHY (2) is entering autonegotiation sequence</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">phy_mc_ksz8081: PHY 2 is up</text>
<text x="24" y="318" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">phy_mc_ksz8081: PHY (2) Link speed 100 Mb, full duplex</text>
<text x="24" y="338" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">net_dhcpv4: Received: &lt;lan address&gt;</text>
<text x="24" y="358" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">aegis: address &lt;lan address&gt;, listening on 7444</text>
<rect x="0" y="394" width="900" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="394" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">Zephyr and the prover</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">Zephyr v4.5.0 starts the Aegis prover 0.1.0.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="103" width="884" height="123" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="394" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">ELS key slots</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">Slots 0-1: the die master key (CKDF only). 2, 3, 6, 7: other ROM keys.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="223" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="394" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">Key and image</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">The key is the same on every boot; the image hash is the APP measurement.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="243" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="245" r="11" fill="#ffd166"/><text x="8" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="394" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">MAC</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">02:ae and the first four bytes of the public key.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="263" width="884" height="103" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="265" r="11" fill="#ffd166"/><text x="8" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="394" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="420" r="13" fill="#ffd166"/><text x="24" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="418" font-size="15" font-weight="bold" fill="#e6ecf1">On the network</text>
<text x="48" y="438" font-size="13" fill="#9aa8b5">100 Mb/s link, an address by DHCP, port 7444 open.</text>
</g>
</svg>
