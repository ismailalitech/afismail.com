<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">Which peripherals the non-secure world may reach on the RW612, under NXP's TF-M defaults and under the Aegis rules. NXP's defaults leave the fuse controller, FlexSPI, the flash caches, the TRNG, ROM control, the debug mailbox, the reset, clock and system controllers, the pin mux, the PMU and SOC_TOP open to non-secure code. The Aegis rules make all of them secure-only; the secure partition sets up the Ethernet clocks, reset and pins itself. Only what the network prover needs stays non-secure: ENET, the GPIOs, the console UART, its clock and reset controllers for those, and timers.</title><desc id="d">Which peripherals the non-secure world may reach on the RW612, under NXP's TF-M defaults and under the Aegis rules. NXP's defaults leave the fuse controller, FlexSPI, the flash caches, the TRNG, ROM control, the debug mailbox, the reset, clock and system controllers, the pin mux, the PMU and SOC_TOP open to non-secure code. The Aegis rules make all of them secure-only; the secure partition sets up the Ethernet clocks, reset and pins itself. Only what the network prover needs stays non-secure: ENET, the GPIOs, the console UART, its clock and reset controllers for those, and timers.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 9.80s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 9.80s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}13.27%{opacity:1}16.27%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="380" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M290,105 L330,105" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M290,105 L330,105" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M465,180 L465,230" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:5.20s" d="M465,180 L465,230" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="a">
<rect x="20" y="30" width="270" height="150" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="155" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">NXP defaults: non-secure</text>
<text x="155" y="84" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">OCOTP (fuses), FlexSPI + OTFAD,</text>
<text x="155" y="101" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">flash caches, TRNG, ROM ctrl,</text>
<text x="155" y="118" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">debug mailbox, RSTCTL0, CLKCTL0,</text>
<text x="155" y="135" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SYSCTL0, SYSCTL2, pin mux,</text>
<text x="155" y="152" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PMU, SOC_TOP</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="272" height="152" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="b">
<rect x="330" y="30" width="270" height="150" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="465" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Aegis rules: secure only</text>
<text x="465" y="84" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the same blocks;</text>
<text x="465" y="101" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the secure partition sets up</text>
<text x="465" y="118" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the Ethernet clocks, reset</text>
<text x="465" y="135" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">and pins before the</text>
<text x="465" y="152" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">non-secure image runs</text>
<rect class="hl" style="animation-delay:2.60s" x="329" y="29" width="272" height="152" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c">
<rect x="640" y="30" width="240" height="150" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="760" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Still non-secure</text>
<text x="760" y="84" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ENET, GPIO, the console</text>
<text x="760" y="101" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">UART (FLEXCOMM3),</text>
<text x="760" y="118" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">CLKCTL1, RSTCTL1, timers:</text>
<text x="760" y="135" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">what the network</text>
<text x="760" y="152" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">prover needs</text>
<rect class="hl" style="animation-delay:3.90s" x="639" y="29" width="242" height="152" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="p">
<rect x="330" y="230" width="270" height="110" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="465" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Measured on the board</text>
<text x="465" y="281" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">probe.sh: a non-secure read of</text>
<text x="465" y="298" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">each secure-only block faults;</text>
<text x="465" y="315" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the ENET register still reads</text>
<rect class="hl" style="animation-delay:6.50s" x="329" y="229" width="272" height="112" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
