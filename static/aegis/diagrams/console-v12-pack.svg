<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">In the signed result</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">aegis.pack-signed and the audit log's head when it was signed.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="103" width="1044" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="474" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">aegis.warnings</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">An admitted endpoint's cautions, in one place.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="183" width="1044" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="474" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Signed export time</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">manifest.cose verifies under the verifier key.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="223" width="1044" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="474" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Signature stripped</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">The result says it was there: refused.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="303" width="1044" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="305" r="11" fill="#ffd166"/><text x="8" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="474" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Time moved</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">Not the manifest the verifier signed.</text>
</g>
<g class="co" style="animation-delay:17.00s"><rect x="8" y="363" width="1044" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="365" r="11" fill="#ffd166"/><text x="8" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">6</text></g>
<g class="co cap" style="animation-delay:17.00s">
<rect x="0" y="474" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="500" r="13" fill="#ffd166"/><text x="24" y="505" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="498" font-size="15" font-weight="bold" fill="#e6ecf1">Result as anchor</text>
<text x="48" y="518" font-size="13" fill="#9aa8b5">Batch 1 is in the log; the admit is in batch 2.</text>
</g>
