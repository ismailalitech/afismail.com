<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">Two STM32H573 chips with the same firmware, option bytes and boot loader. Each has its own hardware-unique key, so the Aegis ML-DSA-65 key derived from it differs between the chips. The PSA attestation key comes from TF-M's development provisioning, which writes the same fixed key on every board, so the PSA identity is the same. The gateway pins the ML-DSA key per device, so chip 2 is refused under chip 1's name.</title><desc id="d">Two STM32H573 chips with the same firmware, option bytes and boot loader. Each has its own hardware-unique key, so the Aegis ML-DSA-65 key derived from it differs between the chips. The PSA attestation key comes from TF-M's development provisioning, which writes the same fixed key on every board, so the PSA identity is the same. The gateway pins the ML-DSA key per device, so chip 2 is refused under chip 1's name.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
