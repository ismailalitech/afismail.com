<rect width="1160" height="304" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="1160" height="234" fill="#0d1117"/>
<rect x="0" y="0" width="1160" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="580" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">first boot from the encrypted, PUF-keyed image</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">(serial console at power-on, no JTAG attached)</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">Zynq MP First Stage Boot Loader (TE0807 hooks, Aegis 2025.2)</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">AEGIS: hand-off flags=0x7 meas=7 bh_key_src=0xA35C7C53 csu_status=0x3</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">NOTICE:  BL31: v2.12.0(release):xilinx-v2025.2</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">I/TC: OP-TEE version: 4.7.0-dev #1 Wed Nov 18 23:02:43 UTC 2026 aarch64</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">I/TC: Aegis hand-off: flags 0x7, 7 measurements, keys from the device seed</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">Secure Boot:    authenticated, encrypted</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">I/TA: Aegis TA: key ready, profile aegis-zynqmp-optee-v1, hand-off status 1 flags 0x7 bh_key_src 0xa35c7c53 csu_status 0x3, 7 measurements</text>
<rect x="0" y="234" width="1160" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="1144" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="234" width="1160" height="70" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">FSBL</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">Seed derived under the device key, seven partitions measured, black key named in the header.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="103" width="1144" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="234" width="1160" height="70" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">OP-TEE</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">TF-A starts OP-TEE 4.7, which takes the hand-off page.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="143" width="1144" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="234" width="1160" height="70" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">Keys from the chip</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">OP-TEE derives its keys from the device seed, not its development HUK.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="163" width="1144" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="165" r="11" fill="#ffd166"/><text x="8" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="234" width="1160" height="70" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">U-Boot</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">The boot ROM authenticated and decrypted the image.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="183" width="1144" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="234" width="1160" height="70" fill="#12171d"/>
<circle cx="24" cy="260" r="13" fill="#ffd166"/><text x="24" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="258" font-size="15" font-weight="bold" fill="#e6ecf1">The Aegis TA</text>
<text x="48" y="278" font-size="13" fill="#9aa8b5">Key ready on the profile the gateway pins.</text>
</g>
</svg>
