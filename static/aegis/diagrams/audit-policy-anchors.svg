<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">The signed policy and the audit log. On the operator's PC, policy-sign signs the policy with an ML-DSA-65 key sealed to the PC's TPM. On the gateway, aegis-fleet runs only from a policy signed by a key in policy-signers.json and never from an older version. Its decisions go into an audit log: batches chained by SHA-256, one signature per batch, written only when something changes. On the PC, audit_anchors.py fetches the last batch record every 300 seconds and keeps it where the gateway cannot write, and verify_audit.py checks the whole log against every anchor kept.</title><desc id="d">The signed policy and the audit log. On the operator's PC, policy-sign signs the policy with an ML-DSA-65 key sealed to the PC's TPM. On the gateway, aegis-fleet runs only from a policy signed by a key in policy-signers.json and never from an older version. Its decisions go into an audit log: batches chained by SHA-256, one signature per batch, written only when something changes. On the PC, audit_anchors.py fetches the last batch record every 300 seconds and keeps it where the gateway cannot write, and verify_audit.py checks the whole log against every anchor kept.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M270,72 L325,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M270,72 L325,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="276.4" y="50" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="297.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">signs</text>
</g>
<g id="e1">
<path d="M575,72 L630,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M575,72 L630,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="581.4" y="50" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="602.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">loads</text>
</g>
<g id="e2">
<path d="M755,114 L755,210" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M755,114 L755,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="759" y="153" width="67.96" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="764" y="165.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">decisions</text>
</g>
<g id="e3">
<path d="M630,260 L575,260" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M630,260 L575,260" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="581.4" y="238" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="602.5" y="250.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">fetch</text>
</g>
<g id="e4">
<path d="M325,260 L270,260" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M325,260 L270,260" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="276.4" y="238" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="297.5" y="250.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">check</text>
</g>
<g id="sign">
<rect x="20" y="30" width="250" height="84" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="145" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">policy-sign</text>
<text x="145" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">operator's PC</text>
<text x="145" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ML-DSA-65 key sealed</text>
<text x="145" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">to the PC's TPM</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="pol">
<rect x="325" y="30" width="250" height="84" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="450" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">fleet.cose</text>
<text x="450" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the policy in a COSE_Sign1</text>
<text x="450" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">version that never goes back</text>
<rect class="hl" style="animation-delay:2.60s" x="324" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fl">
<rect x="630" y="30" width="250" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="755" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegis-fleet</text>
<text x="755" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">checks the signer against</text>
<text x="755" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">policy-signers.json</text>
<text x="755" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">every 30 s cycle</text>
<rect class="hl" style="animation-delay:5.20s" x="629" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="log">
<rect x="630" y="210" width="250" height="100" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="755" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Audit log</text>
<text x="755" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">batches chained by SHA-256</text>
<text x="755" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one signature per batch</text>
<text x="755" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">only when something changes</text>
<rect class="hl" style="animation-delay:7.80s" x="629" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="anc">
<rect x="325" y="210" width="250" height="100" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="450" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">audit_anchors.py</text>
<text x="450" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">on the PC, every 300 s:</text>
<text x="450" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the last batch record,</text>
<text x="450" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">kept read-only</text>
<rect class="hl" style="animation-delay:10.40s" x="324" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="chk">
<rect x="20" y="210" width="250" height="100" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="145" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">verify_audit.py</text>
<text x="145" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the whole log against</text>
<text x="145" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">every anchor kept</text>
<text x="145" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no Aegis code</text>
<rect class="hl" style="animation-delay:13.00s" x="19" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
