<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 444" width="1060" height="444" role="img" aria-labelledby="t d">
<title id="t">a device on the Prover SDK, attested on the PC</title><desc id="d">sdk/examples/simulated-device/run.sh on the build PC: the SDK and a device in one C file are built with the EAT option, a verifier identity is made, the device is enrolled and admitted with trust software and a session bound to its quote, a KMAC256 heartbeat verifies, the evidence pack verifies with the standalone checker, an image with one changed byte is quarantined, and the verifier's signed audit log verifies: 11 entries in 3 signed batches.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 22.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 22.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}15.18%{opacity:1}18.18%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="1060" height="444" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="1060" height="374" fill="#0d1117"/>
<rect x="0" y="0" width="1060" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="530" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">a device on the Prover SDK, attested on the PC</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">sdk/examples/simulated-device/run.sh</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 1 Python with ML-DSA-65 (cryptography)               ok  (cryptography 50.0.2)</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 2 build the SDK and the device (AEGIS_EAT_COSE=1)    ok  (116908 bytes)</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 3 verifier identity (aegisd.py init)                 ok  (key sha256 750691eb1fd18989...)</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 4 device secret and firmware image                   ok  (APP sha256 fe88ae045060324b...)</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 5 start the simulated device                         ok  (127.0.0.1:38225, key sha256 fa8a3a7c87f2d28b...)</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 6 enrol the device key (fleet.py enroll-pq)          ok</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 7 policy check (fleet.py check)                      ok</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 8 attest and provision (fleet.py once)               ok  (ADMITTED, trust software, session bound to the quote, eat-cose-v1)</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve"> 9 same session on both sides (fleet.py session)      ok</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">10 KMAC256 heartbeat with the session key             ok  (fw=sim-1.0.0;requests=6;ttl=3825 counter 1)</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">11 evidence pack: tools/verify_evidence.py            ok  (EAT, result and keys verified)</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">12 changed image: quarantined                         ok  (component APP not allowed (measurement b38718fb24db...))</text>
<text x="24" y="318" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">13 audit log: tools/verify_audit.py                   ok  (11 entries in 3 signed batches)</text>
<text x="24" y="338" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">RESULT: PASS (work directory /tmp/aegis-sim.XXXXXX, kept)</text>
<rect x="0" y="374" width="1060" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="83" width="1044" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="374" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="400" r="13" fill="#ffd166"/><text x="24" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="398" font-size="15" font-weight="bold" fill="#e6ecf1">Build</text>
<text x="48" y="418" font-size="13" fill="#9aa8b5">libaegis_sdk.a and the device, from the SDK's two public headers only.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="143" width="1044" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="374" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="400" r="13" fill="#ffd166"/><text x="24" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="398" font-size="15" font-weight="bold" fill="#e6ecf1">Enrolled and admitted</text>
<text x="48" y="418" font-size="13" fill="#9aa8b5">fleet.py, the code the gateway runs: trust software, a session bound to the quote.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="223" width="1044" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="374" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="400" r="13" fill="#ffd166"/><text x="24" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="398" font-size="15" font-weight="bold" fill="#e6ecf1">Session</text>
<text x="48" y="418" font-size="13" fill="#9aa8b5">Both sides name the same session; a KMAC256 heartbeat with ttl.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="263" width="1044" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="265" r="11" fill="#ffd166"/><text x="8" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="374" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="400" r="13" fill="#ffd166"/><text x="24" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="398" font-size="15" font-weight="bold" fill="#e6ecf1">Evidence pack</text>
<text x="48" y="418" font-size="13" fill="#9aa8b5">The EAT, the signed result and the keys, checked without Aegis code.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="283" width="1044" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="285" r="11" fill="#ffd166"/><text x="8" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="374" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="400" r="13" fill="#ffd166"/><text x="24" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="398" font-size="15" font-weight="bold" fill="#e6ecf1">Changed image</text>
<text x="48" y="418" font-size="13" fill="#9aa8b5">One byte of the image changed: quarantined on its measurement.</text>
</g>
<g class="co" style="animation-delay:17.00s"><rect x="8" y="303" width="1044" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="305" r="11" fill="#ffd166"/><text x="8" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">6</text></g>
<g class="co cap" style="animation-delay:17.00s">
<rect x="0" y="374" width="1060" height="70" fill="#12171d"/>
<circle cx="24" cy="400" r="13" fill="#ffd166"/><text x="24" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="398" font-size="15" font-weight="bold" fill="#e6ecf1">Audit log</text>
<text x="48" y="418" font-size="13" fill="#9aa8b5">The verifier's signed log of all of it.</text>
</g>
</svg>
