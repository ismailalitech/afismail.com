<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
<title id="t">One gateway port and a VLAN switch, as tested in network namespaces. The endpoint ports are untagged members of VLAN 20 only; the router's port is on VLAN 1; the gateway's single port carries VLAN 1 untagged and VLAN 20 tagged. The gateway has a VLAN interface for VLAN 20, routes and masquerades between it and the LAN, and enforces the ruleset on it. An endpoint reaches the LAN only through the gateway, and only while admitted; a LAN address or self-tagged frames on an endpoint get nowhere.</title><desc id="d">One gateway port and a VLAN switch, as tested in network namespaces. The endpoint ports are untagged members of VLAN 20 only; the router's port is on VLAN 1; the gateway's single port carries VLAN 1 untagged and VLAN 20 tagged. The gateway has a VLAN interface for VLAN 20, routes and masquerades between it and the LAN, and enforces the ruleset on it. An endpoint reaches the LAN only through the gateway, and only while admitted; a LAN address or self-tagged frames on an endpoint get nowhere.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="440" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M240,78 L285,78 L285,108 L330,108" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M240,78 L285,78 L285,108 L330,108" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="234.96" y="56" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="262.5" y="68.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">VLAN 20</text>
</g>
<g id="e1">
<path d="M570,108 L615,108 L615,78 L660,78" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M570,108 L615,108 L615,78 L660,78" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="568.18" y="86" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="592.5" y="98.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">VLAN 1</text>
</g>
<g id="e2">
<path d="M450,176 L450,260" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M450,176 L450,260" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="454" y="209" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="459" y="221.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">trunk</text>
</g>
<g id="e3">
<path d="M570,320 L660,320" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M570,320 L660,320" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M240,320 L330,320" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:13.00s" d="M240,320 L330,320" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="ep">
<rect x="20" y="40" width="220" height="76" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="130" y="65.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Endpoints</text>
<text x="130" y="82.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">STM32, RW612, ...</text>
<text x="130" y="99.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">10.20.0.x</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="222" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sw">
<rect x="330" y="40" width="240" height="136" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="450" y="78.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Switch (802.1Q)</text>
<text x="450" y="95.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">endpoint ports: VLAN 20,</text>
<text x="450" y="112.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">untagged, only</text>
<text x="450" y="129.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">gateway port: VLAN 1 untagged</text>
<text x="450" y="146.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">+ VLAN 20 tagged</text>
<rect class="hl" style="animation-delay:2.60s" x="329" y="39" width="242" height="138" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="lan">
<rect x="660" y="40" width="220" height="76" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="770" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Router, PC</text>
<text x="770" y="91" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">VLAN 1, the LAN</text>
<rect class="hl" style="animation-delay:5.20s" x="659" y="39" width="222" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="gw">
<rect x="330" y="260" width="240" height="120" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="290.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Gateway (one port)</text>
<text x="450" y="307.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">end0: LAN</text>
<text x="450" y="324.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">end0.20: endpoint VLAN</text>
<text x="450" y="341.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">routes, masquerades,</text>
<text x="450" y="358.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">aegis.nft on end0.20</text>
<rect class="hl" style="animation-delay:7.80s" x="329" y="259" width="242" height="122" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="blk">
<rect x="20" y="260" width="220" height="120" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="130" y="290.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Blocked at the switch</text>
<text x="130" y="307.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a LAN address on an</text>
<text x="130" y="324.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">endpoint; frames tagged</text>
<text x="130" y="341.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">for VLAN 1; LAN to</text>
<text x="130" y="358.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">endpoint directly</text>
<rect class="hl" style="animation-delay:11.70s" x="19" y="259" width="222" height="122" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="thru">
<rect x="660" y="260" width="220" height="120" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="770" y="290.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Through the gateway</text>
<text x="770" y="307.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">admitted: to the LAN</text>
<text x="770" y="324.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">quarantined: only the</text>
<text x="770" y="341.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">quote port; attestation</text>
<text x="770" y="358.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">always</text>
<rect class="hl" style="animation-delay:10.40s" x="659" y="259" width="222" height="122" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
