<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 424" width="1020" height="424" role="img" aria-labelledby="t d">
<title id="t">the secure stack mark in every heartbeat</title><desc id="d">The gateway journal for the two STM32 boards after the secure image with the stack mark. With the old non-secure prover 0.5.0 the heartbeats carry no stack mark. With prover 0.6.0 every heartbeat ends with sstack=19088/26624, the secure partition's stack high-water mark, under the session's KMAC; board 1 reports the same figure.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="1020" height="424" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="1020" height="354" fill="#0d1117"/>
<rect x="0" y="0" width="1020" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="510" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">the secure stack mark in every heartbeat</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">ssh &lt;gateway&gt; journalctl -u aegis-fleet -o cat | grep stm32h573-dk-2      # new secure image, prover 0.5.0</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:02:15 stm32h573-dk-2 ADMITTED  [credential: issued session e03532f481e2...]</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:02:49 stm32h573-dk-2 ADMITTED  [credential: valid, heartbeat 1 (uptime_s=50;link=1;fw=0.5.0)]</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:03:23 stm32h573-dk-2 ADMITTED  [credential: valid, heartbeat 2 (uptime_s=84;link=1;fw=0.5.0)]</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">ssh &lt;gateway&gt; journalctl -u aegis-fleet -o cat | grep stm32h573-dk-2      # prover 0.6.0</tspan></text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:04:03 stm32h573-dk-2 ADMITTED  [credential: issued session 988db46d4c81...]</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:04:37 stm32h573-dk-2 ADMITTED  [credential: valid, heartbeat 1 (uptime_s=46;link=1;fw=0.6.0;sstack=19088/26624)]</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:05:11 stm32h573-dk-2 ADMITTED  [credential: valid, heartbeat 2 (uptime_s=80;link=1;fw=0.6.0;sstack=19088/26624)]</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:05:45 stm32h573-dk-2 ADMITTED  [credential: valid, heartbeat 3 (uptime_s=114;link=1;fw=0.6.0;sstack=19088/26624)]</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">ssh &lt;gateway&gt; journalctl -u aegis-fleet -o cat | grep 'stm32h573-dk '      # board 1, prover 0.6.0</tspan></text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:08:56 stm32h573-dk ADMITTED  [credential: issued session 836896198fd9...]</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:09:30 stm32h573-dk ADMITTED  [credential: valid, heartbeat 1 (uptime_s=54;link=1;fw=0.6.0;sstack=19088/26624)]</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:10:04 stm32h573-dk ADMITTED  [credential: valid, heartbeat 2 (uptime_s=88;link=1;fw=0.6.0;sstack=19088/26624)]</text>
<text x="24" y="318" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">09:10:38 stm32h573-dk ADMITTED  [credential: valid, heartbeat 3 (uptime_s=122;link=1;fw=0.6.0;sstack=19088/26624)]</text>
<rect x="0" y="354" width="1020" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="1004" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="354" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">New secure image, old prover</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">Admitted on SPE e68ad797; prover 0.5.0 does not ask for the stack mark.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="143" width="1004" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="354" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">Prover 0.6.0</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">Admitted with a new session on the new non-secure image.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="163" width="1004" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="165" r="11" fill="#ffd166"/><text x="8" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="354" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">The stack mark</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">sstack=19088/26624 in every heartbeat, under the KMAC: the depth read over SWD.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="243" width="1004" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="245" r="11" fill="#ffd166"/><text x="8" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="354" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">Board 1</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">The same steps and the same figure: 19,088 of 26,624 bytes.</text>
</g>
</svg>
