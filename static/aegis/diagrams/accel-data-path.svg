<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">What crosses the bus. First core (lab 49): for every Keccak permutation the CPU writes the 200-byte state as 50 words over the 32-bit APB bus and reads 50 words back, 16.7 microseconds for 0.48 of computing. Accelerator v2 (lab 54): the state stays in the fabric in one of 8 slots; the CPU writes only the bytes it absorbs and short commands over APB, and full squeezed blocks go out by DMA as 64-bit AXI bursts into a non-cached DDR page that the CPU copies from.</title><desc id="d">What crosses the bus. First core (lab 49): for every Keccak permutation the CPU writes the 200-byte state as 50 words over the 32-bit APB bus and reads 50 words back, 16.7 microseconds for 0.48 of computing. Accelerator v2 (lab 54): the state stays in the fabric in one of 8 slots; the CPU writes only the bytes it absorbs and short commands over APB, and full squeezed blocks go out by DMA as 64-bit AXI bursts into a non-cached DDR page that the CPU copies from.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 13.70s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 13.70s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.49%{opacity:1}12.49%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="400" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M220,65 L620,65" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M220,65 L620,65" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="337.72" y="43" width="164.56" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="420" y="55.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">APB: 50 words in, 50 out</text>
</g>
<g id="e1">
<path d="M220,232 L620,232" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:5.20s" d="M220,232 L620,232" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="321.62" y="210" width="196.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="420" y="222.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">APB: absorbed bytes, commands</text>
</g>
<g id="e2">
<path d="M750,274 L750,350 L570,350" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.80s" d="M750,274 L750,350 L570,350" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="645.34" y="328" width="29.32" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="660" y="340.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">DMA</text>
</g>
<g id="e3">
<path d="M330,350 L120,350 L120,274" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:10.40s" d="M330,350 L120,350 L120,274" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="207.12" y="328" width="35.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="225" y="340.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">copy</text>
</g>
<g id="cpu1">
<rect x="20" y="30" width="200" height="70" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="120" y="52.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">U54, liboqs</text>
<text x="120" y="69.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">every permutation</text>
<text x="120" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">goes to the fabric</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="202" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="core1">
<rect x="620" y="30" width="260" height="70" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="750" y="52.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegis_pqc (lab 49)</text>
<text x="750" y="69.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">state written in and read back</text>
<text x="750" y="86.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">16.7 us per 0.48 us permutation</text>
<rect class="hl" style="animation-delay:2.60s" x="619" y="29" width="262" height="72" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cpu2">
<rect x="20" y="190" width="200" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="120" y="219.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">U54, liboqs</text>
<text x="120" y="236.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SHA-3 provider: one</text>
<text x="120" y="253.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">slot per hash context</text>
<rect class="hl" style="animation-delay:3.90s" x="19" y="189" width="202" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="core2">
<rect x="620" y="190" width="260" height="84" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="750" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegis_pqc2 (lab 54)</text>
<text x="750" y="228" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">state stays in the fabric</text>
<text x="750" y="245" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">8 slots, 24 clocks per permutation</text>
<text x="750" y="262" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">squeezes N blocks on one command</text>
<rect class="hl" style="animation-delay:6.50s" x="619" y="189" width="262" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ddr">
<rect x="330" y="312" width="240" height="76" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="450" y="337.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">DDR page, non-cached</text>
<text x="450" y="354.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">FIC0 AXI4 bursts, 21 x 64 bits</text>
<text x="450" y="371.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">copied by the CPU, 0.174 us / 8 B</text>
<rect class="hl" style="animation-delay:9.10s" x="329" y="311" width="242" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
