<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="1004" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="534" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="560" r="13" fill="#ffd166"/><text x="24" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">A 32 s credential</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">The endpoint ends it after 34 s: the lifetime plus a sixteenth.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="83" width="1004" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="534" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="560" r="13" fill="#ffd166"/><text x="24" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">ttl and the clock rate</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">ttl, under the KMAC, falls from 34 to 18. The STM32 RTC on the LSI runs at 0.941.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="143" width="1004" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="534" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="560" r="13" fill="#ffd166"/><text x="24" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">After the end</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">Heartbeat and session query: -140, ended by the clock. Attestation still answers.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="203" width="1004" height="143" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="205" r="11" fill="#ffd166"/><text x="8" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="534" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="560" r="13" fill="#ffd166"/><text x="24" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">Board 1</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">The same values: 34, 18, 0.941, -140, a token.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="383" width="1004" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="385" r="11" fill="#ffd166"/><text x="8" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="534" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="560" r="13" fill="#ffd166"/><text x="24" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">RW612 secure SysTick</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">clk=ref, the function clock: 1.0 against the gateway.</text>
</g>
<g class="co" style="animation-delay:17.00s"><rect x="8" y="443" width="1004" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="445" r="11" fill="#ffd166"/><text x="8" y="449" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">6</text></g>
<g class="co cap" style="animation-delay:17.00s">
<rect x="0" y="534" width="1020" height="70" fill="#12171d"/>
<circle cx="24" cy="560" r="13" fill="#ffd166"/><text x="24" y="565" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">6</text>
<text x="48" y="558" font-size="15" font-weight="bold" fill="#e6ecf1">RW612 after the end</text>
<text x="48" y="578" font-size="13" fill="#9aa8b5">ERR pq expired from its protocol code; attestation still answers.</text>
</g>
</svg>
