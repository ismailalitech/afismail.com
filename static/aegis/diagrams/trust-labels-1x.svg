<text x="135" y="190.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">device-key</text>
<rect class="hl" style="animation-delay:2.60s" x="19" y="159" width="232" height="54" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sw">
<rect x="20" y="230" width="230" height="52" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="135" y="260.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">software</text>
<rect class="hl" style="animation-delay:3.90s" x="19" y="229" width="232" height="54" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dsk">
<rect x="20" y="300" width="230" height="52" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="135" y="330.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">development-shared-key</text>
<rect class="hl" style="animation-delay:5.20s" x="19" y="299" width="232" height="54" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="275" y="42" text-anchor="start" font-size="12" fill="#9aa8b5">RW612 TF-M partition; Zynq UltraScale+ TA with the PUF key; affirming</text>
<text x="275" y="112" text-anchor="start" font-size="12" fill="#9aa8b5">Both STM32s since 1.1: TF-M's published attestation key; status warning</text>
<text x="275" y="182" text-anchor="start" font-size="12" fill="#9aa8b5">A single-image prover with a key of the chip that measures itself</text>
<text x="275" y="252" text-anchor="start" font-size="12" fill="#9aa8b5">A key in a file: the Linux prover, the simulated device</text>
<text x="275" y="322" text-anchor="start" font-size="12" fill="#9aa8b5">One key on every chip: refused unless the policy allows it</text>
</svg>
