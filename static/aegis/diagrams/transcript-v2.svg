<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">Transcript v2. The gateway's challenge and the endpoint's signed token give T1. PQKEMINIT carries that challenge, and the endpoint signs its ML-KEM key over T2, which contains T1. The gateway's credential names T2, and the session key comes from T3, which contains T2. A session therefore goes only to the code whose quote was appraised, in the boot that signed it. An image swapped in after the quote cannot continue it: the exchange is refused before a credential is sent.</title><desc id="d">Transcript v2. The gateway's challenge and the endpoint's signed token give T1. PQKEMINIT carries that challenge, and the endpoint signs its ML-KEM key over T2, which contains T1. The gateway's credential names T2, and the session key comes from T3, which contains T2. A session therefore goes only to the code whose quote was appraised, in the boot that signed it. An image swapped in after the quote cannot continue it: the exchange is refused before a credential is sent.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="330" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M220,72 L245,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M220,72 L245,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M435,72 L460,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M435,72 L460,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M660,72 L685,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M660,72 L685,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M782.5,114 L782.5,210" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M782.5,114 L782.5,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M560,114 L560,162 L395,162 L395,210" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M560,114 L560,162 L395,162 L395,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="437.08" y="140" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="477.5" y="152.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">a swap here</text>
</g>
<g id="q">
<rect x="20" y="30" width="200" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="120" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Quote</text>
<text x="120" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">challenge and token,</text>
<text x="120" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signed by the device key</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="202" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t1">
<rect x="245" y="30" width="190" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="340" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">T1</text>
<text x="340" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SHA3-256 of a label,</text>
<text x="340" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the challenge and</text>
<text x="340" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SHA3-256(token)</text>
<rect class="hl" style="animation-delay:2.60s" x="244" y="29" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ek">
<rect x="460" y="30" width="200" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="560" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">PQKEMINIT</text>
<text x="560" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ML-KEM key signed</text>
<text x="560" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">over T2 = (T1, key)</text>
<rect class="hl" style="animation-delay:5.20s" x="459" y="29" width="202" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cr">
<rect x="685" y="30" width="195" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="782.5" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Credential</text>
<text x="782.5" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">names T2, signed</text>
<text x="782.5" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">by the gateway</text>
<rect class="hl" style="animation-delay:7.80s" x="684" y="29" width="197" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ses">
<rect x="685" y="210" width="195" height="84" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="782.5" y="239.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Session key</text>
<text x="782.5" y="256.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">from T3 = (T2,</text>
<text x="782.5" y="273.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ciphertext, credential)</text>
<rect class="hl" style="animation-delay:10.40s" x="684" y="209" width="197" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="swap">
<rect x="245" y="210" width="300" height="84" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="395" y="239.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Another image after the quote</text>
<text x="395" y="256.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">cannot continue it: refused</text>
<text x="395" y="273.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">before a credential is sent</text>
<rect class="hl" style="animation-delay:13.00s" x="244" y="209" width="302" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
