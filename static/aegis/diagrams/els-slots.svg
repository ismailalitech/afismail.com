<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">The twenty ELS key slots of the RW612 and why the first version reset the chip. A 256-bit key takes two consecutive slots: a base slot and the next one. The boot ROM leaves the die master key in slots 0 and 1 and other keys in slots 2, 3, 6 and 7. The first version asked ELS for a 256-bit key with base slot 19, the last one: there is no slot 20, ELS raised a fault, and the chip reset every time. The fix looks for an even base slot whose pair is free, from the top: slots 18 and 19.</title><desc id="d">The twenty ELS key slots of the RW612 and why the first version reset the chip. A 256-bit key takes two consecutive slots: a base slot and the next one. The boot ROM leaves the die master key in slots 0 and 1 and other keys in slots 2, 3, 6 and 7. The first version asked ELS for a 256-bit key with base slot 19, the last one: there is no slot 20, ELS raised a fault, and the chip reset every time. The fix looks for an even base slot whose pair is free, from the top: slots 18 and 19.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.90s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.90s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.88%{opacity:1}9.88%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
