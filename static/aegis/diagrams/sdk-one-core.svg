<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
<title id="t">The Prover SDK. One protocol core, sdk/src/aegis_proto.c, does the quote, the ML-KEM exchange, the transcript, the KMAC heartbeat and the session's end. Each device adds a platform file (randomness, a clock, measurements or a token, the identity seed, a status text) and a transport. On the bench three secure worlds build it: the STM32H573 as a TF-M partition with its key from the DHUK, the RW612 as a TF-M partition with its key from ELS, and the Zynq UltraScale+ as an OP-TEE trusted application with its key from the PUF-derived seed. A Linux port and the PC's simulated device build it too, with software trust.</title><desc id="d">The Prover SDK. One protocol core, sdk/src/aegis_proto.c, does the quote, the ML-KEM exchange, the transcript, the KMAC heartbeat and the session's end. Each device adds a platform file (randomness, a clock, measurements or a token, the identity seed, a status text) and a transport. On the bench three secure worlds build it: the STM32H573 as a TF-M partition with its key from the DHUK, the RW612 as a TF-M partition with its key from ELS, and the Zynq UltraScale+ as an OP-TEE trusted application with its key from the PUF-derived seed. A Linux port and the PC's simulated device build it too, with software trust.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.90s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.90s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.88%{opacity:1}9.88%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
