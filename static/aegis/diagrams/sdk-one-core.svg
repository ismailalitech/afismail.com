<text x="340" y="283" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">key from ELS</text>
<text x="340" y="300" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">lines in a PSA message</text>
