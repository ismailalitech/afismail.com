<g id="plat">
<rect x="20" y="30" width="250" height="84" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="145" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Platform file</text>
<text x="145" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">random, clock, measurements,</text>
<text x="145" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">identity seed, status text</text>
<text x="145" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">about 150 lines per chip</text>
