<text x="755" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">one request in, one reply out</text>
<text x="755" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a text line or a binary call</text>
<rect class="hl" style="animation-delay:5.20s" x="629" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
