<text x="450" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Prover SDK core</text>
<text x="450" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">sdk/src/aegis_proto.c</text>
<text x="450" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">quote, exchange, transcript,</text>
<text x="450" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">heartbeat, session end</text>
<rect class="hl" style="animation-delay:2.60s" x="319" y="29" width="262" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
