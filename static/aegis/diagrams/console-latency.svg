<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" role="img" aria-labelledby="t d">
<title id="t">Linux interrupt latency: five setups</title><desc id="d">Five setups of the Linux interrupt-latency measurement: the default, a pinned process at normal priority, a pinned real-time process on two cores, and the real-time process under full CPU load. Only the real-time rows have no overruns.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.95%{opacity:1}24.95%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="364" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="294" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">Linux interrupt latency: five setups</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">tools/board/latency_ab.sh ; tools/board/latency_load.sh</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">A_default_1 {"overrun": 24, "mean": 78.95, "p999": 163.82, "max": 4945.36}</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">A_default_2 {"overrun": 37, "mean": 81.15, "p999": 163.82, "max": 3594.92}</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">B_cpu2_pinned_1 {"overrun": 64, "mean": 61.85, "p999": 122.86, "max": 4704.78}</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">B_cpu2_pinned_2 {"overrun": 152, "mean": 62.14, "p999": 122.86, "max": 5104.74}</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">C_cpu2_fifo80_1 {"overrun": 0, "mean": 53.82, "p999": 122.86, "max": 446.5}</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">C_cpu2_fifo80_2 {"overrun": 0, "mean": 53.64, "p999": 122.86, "max": 412.66}</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">D_cpu1_fifo80_1 {"overrun": 0, "mean": 53.62, "p999": 122.86, "max": 359.32}</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">D_cpu1_fifo80_2 {"overrun": 0, "mean": 53.59, "p999": 81.9, "max": 469.4}</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">LOAD_C_cpu2_fifo80_1 {"overrun": 3, "mean": 51.55, "p999": 122.86, "max": 1472.78}</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">LOAD_C_cpu2_fifo80_2 {"overrun": 0, "mean": 51.24, "p999": 122.86, "max": 407.82}</text>
<rect x="0" y="294" width="900" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="294" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Default</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">Maximum 3.6 to 4.9 ms and dozens of overruns: scheduling, one tick at 250 Hz is 4 ms.</text>
</g>
<g class="co" style="animation-delay:3.60s"><rect x="8" y="103" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.60s">
<rect x="0" y="294" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Pinned, normal priority</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">Moving the interrupt and task to another core does not help.</text>
</g>
<g class="co" style="animation-delay:7.20s"><rect x="8" y="143" width="884" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:7.20s">
<rect x="0" y="294" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Pinned, SCHED_FIFO 80</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">No overruns and a maximum under half a millisecond, on CPU2 and on CPU1.</text>
</g>
<g class="co" style="animation-delay:10.80s"><rect x="8" y="223" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.80s">
<rect x="0" y="294" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Under load</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">A busy loop on every core: 0 and 3 overruns; one run reached 1.47 ms. Not a hard bound.</text>
</g>
</svg>
