<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="294" width="1100" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">TrustZone admitted</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">A credential through the secure partition, then heartbeats.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="123" width="1084" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="125" r="11" fill="#ffd166"/><text x="8" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="294" width="1100" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Modified non-secure image</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">Unreachable while it is flashed, then NSPE not allowed: credential revoked.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="183" width="1084" height="83" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="294" width="1100" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Good image back</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">Flashed again, then admitted with a new session and heartbeats.</text>
</g>
