<text x="760" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Evidence pack</text>
<text x="760" y="246" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">fleet.py export-evidence</text>
<text x="760" y="263" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">manifest, evidence,</text>
<text x="760" y="280" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">result, keys</text>
<rect class="hl" style="animation-delay:7.80s" x="639" y="199" width="242" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="chk">
