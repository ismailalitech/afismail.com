<text x="450" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">verify_evidence.py</text>
<text x="450" y="246" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pycose 1.1.0, cbor2,</text>
<text x="450" y="263" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">OpenSSL 3.5 for ML-DSA</text>
<text x="450" y="280" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no Aegis code</text>
<rect class="hl" style="animation-delay:10.40s" x="329" y="199" width="242" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="rp">
<rect x="20" y="200" width="240" height="100" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="140" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Relying party</text>
<text x="140" y="246" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">compares the key</text>
<text x="140" y="263" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">thumbprints with keys</text>
<text x="140" y="280" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">it already trusts</text>
<rect class="hl" style="animation-delay:13.00s" x="19" y="199" width="242" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
