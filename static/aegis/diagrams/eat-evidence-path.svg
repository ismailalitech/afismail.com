<rect x="270.68" y="228" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="295" y="240.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">report</text>
</g>
<g id="dev">
<rect x="20" y="30" width="240" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="140" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Device secure world</text>
<text x="140" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">EAT, RFC 9711</text>
<text x="140" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">in a COSE_Sign1, RFC 9052</text>
<text x="140" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ML-DSA-65, algorithm -49</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="242" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ver">
<rect x="330" y="30" width="240" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegis-fleet</text>
<text x="450" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">nonce, signature, profile,</text>
<text x="450" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">measurements against</text>
<text x="450" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the policy</text>
<rect class="hl" style="animation-delay:2.60s" x="329" y="29" width="242" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ear">
<rect x="640" y="30" width="240" height="84" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="760" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Attestation result</text>
<text x="760" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">EAR and AR4SI (IETF drafts)</text>
<text x="760" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signed by the verifier</text>
<text x="760" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">status and trust vector</text>
<rect class="hl" style="animation-delay:5.20s" x="639" y="29" width="242" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="pack">
