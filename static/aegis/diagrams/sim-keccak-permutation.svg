<rect x="0" y="336" width="900" height="94" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="140" y="30" width="120" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="140" cy="30" r="11" fill="#ffd166"/><text x="140" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="336" width="900" height="94" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">State words in</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">The CPU writes the state into the block one 32-bit word per APB transfer.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="260" y="30" width="40" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="260" cy="30" r="11" fill="#ffd166"/><text x="260" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="336" width="900" height="94" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">Start</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">A write of 1 to CTRL starts one Keccak-f[1600] permutation.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="300" y="30" width="480" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="300" cy="30" r="11" fill="#ffd166"/><text x="300" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="336" width="900" height="94" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">24 clocks</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">k_busy is high for 480 ns, 24 rounds at one per clock. STATUS is polled meanwhile.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="780" y="30" width="100" height="300" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="780" cy="30" r="11" fill="#ffd166"/><text x="780" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="336" width="900" height="94" fill="#12171d"/>
<circle cx="24" cy="364" r="13" fill="#ffd166"/><text x="24" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="362" font-size="15" font-weight="bold" fill="#e6ecf1">Done</text>
<text x="48" y="382" font-size="13" fill="#9aa8b5">k_done goes high as the permutation ends; the next transfer reads the result.</text>
</g>
</svg>
