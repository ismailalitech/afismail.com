<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d">
<title id="t">Waveform from the RTL simulation of the aegis_pqc block on its APB slot. The CPU writes the last state words, writes 1 to the control register, and the busy signal then stays high for 480 nanoseconds, 24 clocks, while the status register is polled. Done goes high as it ends and the result is read back.</title><desc id="d">Waveform from the RTL simulation of the aegis_pqc block on its APB slot. The CPU writes the last state words, writes 1 to the control register, and the busy signal then stays high for 480 nanoseconds, 24 clocks, while the status register is polled. Done goes high as it ends and the result is read back.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
