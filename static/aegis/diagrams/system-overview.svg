<rect x="583.9" y="41" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="605" y="53.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">reads</text>
</g>
<g id="e2">
<path d="M320,203 L250,203" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.80s" d="M320,203 L250,203" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="267.12" y="181" width="35.76" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="285" y="193.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">hash</text>
</g>
<g id="e3">
<path d="M445,236 L445,310" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:10.40s" d="M445,236 L445,310" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="449" y="264" width="113.04" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="454" y="276.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">PQCHAL / PQTOKEN</text>
</g>
<g id="e4">
<path d="M570,203 L760,203 L760,310" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:13.00s" d="M570,203 L760,203 L760,310" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="608.48" y="181" width="113.04" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="665" y="193.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">asks for a token</text>
</g>
<g id="pc">
<rect x="20" y="30" width="230" height="66" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="135" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">PC</text>
<text x="135" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">aegis_verify.py</text>
<text x="135" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">regression and demo</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="aegisd">
<rect x="320" y="30" width="250" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="445" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegisd</text>
<text x="445" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">gateway quote, ML-DSA-65</text>
<text x="445" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">TCP 7443</text>
<rect class="hl" style="animation-delay:2.60s" x="319" y="29" width="252" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sys">
<rect x="640" y="30" width="240" height="66" rx="9" fill="#232c44" stroke="#8da6d4" stroke-width="1.5"/>
<text x="760" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">System controller</text>
<text x="760" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">device certificate, digests</text>
<text x="760" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">nonce, design info</text>
<rect class="hl" style="animation-delay:5.20s" x="639" y="29" width="242" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fleet">
<rect x="320" y="170" width="250" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="445" y="190.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegis-fleet</text>
<text x="445" y="207.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">attest, admit, quarantine</text>
<text x="445" y="224.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ML-KEM credentials</text>
<rect class="hl" style="animation-delay:6.50s" x="319" y="169" width="252" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fab">
<rect x="20" y="170" width="230" height="66" rx="9" fill="#1a3626" stroke="#5fbf84" stroke-width="1.5"/>
<text x="135" y="190.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Fabric accelerator</text>
<text x="135" y="207.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">Keccak sponge and NTT, slot 14</text>
<text x="135" y="224.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">DMA to DDR, 1.2-1.5x faster</text>
<rect class="hl" style="animation-delay:9.10s" x="19" y="169" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="stm">
<rect x="320" y="310" width="250" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="445" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">STM32H573I-DK</text>
<text x="445" y="348" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">TF-M v2.3.0 + PQ partition</text>
<text x="445" y="365" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">DHUK-derived ML-DSA-65 key</text>
<text x="445" y="382" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">TCP 7444 over Ethernet</text>
<rect class="hl" style="animation-delay:11.70s" x="319" y="309" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="uno">
<rect x="640" y="310" width="240" height="84" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="760" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Arduino Uno</text>
<text x="760" y="348" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no keys, no measured boot</text>
<text x="760" y="365" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reached through a PC relay</text>
<text x="760" y="382" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">TCP 7445</text>
<rect class="hl" style="animation-delay:14.30s" x="639" y="309" width="242" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
