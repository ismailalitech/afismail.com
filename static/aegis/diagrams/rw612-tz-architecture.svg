<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">The FRDM-RW612 with TrustZone. In the secure world, TF-M runs its own services and the Aegis partition: the partition hashes the secure and non-secure flash partitions, derives the ML-DSA-65 key in ELS (which only secure privileged code can reach, and which TF-M's crypto sets up), and runs the Aegis protocol. In the non-secure world, the network prover runs Ethernet, lwIP and a TCP server on port 7444; it passes each request line to the partition with psa_call and sends the reply back. It holds no key and cannot change a measurement. The gateway talks to the non-secure side over Ethernet.</title><desc id="d">The FRDM-RW612 with TrustZone. In the secure world, TF-M runs its own services and the Aegis partition: the partition hashes the secure and non-secure flash partitions, derives the ML-DSA-65 key in ELS (which only secure privileged code can reach, and which TF-M's crypto sets up), and runs the Aegis protocol. In the non-secure world, the network prover runs Ethernet, lwIP and a TCP server on port 7444; it passes each request line to the partition with psa_call and sends the reply back. It holds no key and cannot change a measurement. The gateway talks to the non-secure side over Ethernet.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.90s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.90s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.88%{opacity:1}9.88%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
