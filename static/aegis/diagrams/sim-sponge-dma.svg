<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
<title id="t">Waveform from the RTL simulation of aegis_pqc2 squeezing one block by DMA. The CPU writes the SQUEEZE command; the sponge is busy for 24 clocks computing the permutation, then raises AWVALID for one burst and sends the 21 lanes of the block as 64-bit beats while the memory model holds WREADY low at random; WLAST marks the 21st beat and the write response follows.</title><desc id="d">Waveform from the RTL simulation of aegis_pqc2 squeezing one block by DMA. The CPU writes the SQUEEZE command; the sponge is busy for 24 clocks computing the permutation, then raises AWVALID for one burst and sends the 21 lanes of the block as 64-bit beats while the memory model holds WREADY low at random; WLAST marks the 21st beat and the write response follows.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 7.36s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 7.36s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}18.21%{opacity:1}21.21%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
