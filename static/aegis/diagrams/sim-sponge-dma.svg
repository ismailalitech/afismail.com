<g class="co" style="animation-delay:0.00s"><rect x="140" y="30" width="47.234" height="420" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="140" cy="30" r="11" fill="#ffd166"/><text x="140" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="456" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="484" r="13" fill="#ffd166"/><text x="24" y="489" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="482" font-size="15" font-weight="bold" fill="#e6ecf1">Command</text>
<text x="48" y="502" font-size="13" fill="#9aa8b5">One APB write of SQUEEZE to SCMD starts the whole transfer.</text>
</g>
<g class="co" style="animation-delay:1.34s"><rect x="187.234" y="30" width="188.936" height="420" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="187.234" cy="30" r="11" fill="#ffd166"/><text x="187.234" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:1.34s">
<rect x="0" y="456" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="484" r="13" fill="#ffd166"/><text x="24" y="489" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="482" font-size="15" font-weight="bold" fill="#e6ecf1">Permutation</text>
<text x="48" y="502" font-size="13" fill="#9aa8b5">24 clocks, 480 ns: the state never leaves the fabric.</text>
</g>
<g class="co" style="animation-delay:2.68s"><rect x="376.17" y="30" width="456.596" height="420" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="376.17" cy="30" r="11" fill="#ffd166"/><text x="376.17" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:2.68s">
<rect x="0" y="456" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="484" r="13" fill="#ffd166"/><text x="24" y="489" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="482" font-size="15" font-weight="bold" fill="#e6ecf1">One burst</text>
<text x="48" y="502" font-size="13" fill="#9aa8b5">Address once, then 21 beats of 64 bits (168 bytes); WREADY low = the memory waits.</text>
</g>
<g class="co" style="animation-delay:4.02s"><rect x="832.766" y="30" width="47.234" height="420" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="832.766" cy="30" r="11" fill="#ffd166"/><text x="832.766" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:4.02s">
<rect x="0" y="456" width="900" height="104" fill="#12171d"/>
<circle cx="24" cy="484" r="13" fill="#ffd166"/><text x="24" y="489" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="482" font-size="15" font-weight="bold" fill="#e6ecf1">Response</text>
<text x="48" y="502" font-size="13" fill="#9aa8b5">The write response counts the block; the CPU can copy it while the next one is computed.</text>
</g>
</svg>
