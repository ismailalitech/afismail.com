<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 284" width="940" height="284" role="img" aria-labelledby="t d">
<title id="t">the gateway journal while the endpoint was hardened</title><desc id="d">The gateway journal during the deployment of hedged signing and KMAC heartbeats: the old image stays admitted under the new gateway code; the new image is quarantined because its measurement is not yet in the policy; after the policy is updated it is admitted with a new session and its KMAC256 heartbeats verify. Copied from the terminal output of the session; the gateway journal itself is not kept across reboots.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 15.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 15.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}21.79%{opacity:1}24.79%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="940" height="284" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="940" height="214" fill="#0d1117"/>
<rect x="0" y="0" width="940" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="470" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">the gateway journal while the endpoint was hardened</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">ssh &lt;gateway&gt; journalctl -u aegis-fleet -o cat      # during the deployment, 17 November 2026</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">17:13:05 stm32h573-dk ADMITTED  [credential: valid, heartbeat 2 (uptime_s=60;link=1;fw=0.4.0)]</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">17:13:35 stm32h573-dk ADMITTED  [credential: valid, heartbeat 3 (uptime_s=91;link=1;fw=0.4.0)]</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">17:14:25 stm32h573-dk QUARANTINED component SPE not allowed (measurement a5997cc3c61a...) [credential: revoked]</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">17:14:30 stm32h573-dk ADMITTED  [credential: issued session cd1126078134...]</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">17:15:01 stm32h573-dk ADMITTED  [credential: valid, heartbeat 1 (uptime_s=53;link=1;fw=0.4.0)]</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">17:15:31 stm32h573-dk ADMITTED  [credential: valid, heartbeat 2 (uptime_s=83;link=1;fw=0.4.0)]</text>
<rect x="0" y="214" width="940" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="924" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="214" width="940" height="70" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">New gateway code, old image</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">Still admitted: without a policy change the gateway keeps the first heartbeat.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="103" width="924" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="214" width="940" height="70" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">New image, old policy</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">An image the policy does not know is refused at once and its credential revoked.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="123" width="924" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="125" r="11" fill="#ffd166"/><text x="8" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="214" width="940" height="70" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">Policy updated</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">The new measurement is allowed: admitted with a new session.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="143" width="924" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="214" width="940" height="70" fill="#12171d"/>
<circle cx="24" cy="240" r="13" fill="#ffd166"/><text x="24" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="238" font-size="15" font-weight="bold" fill="#e6ecf1">KMAC256 heartbeats</text>
<text x="48" y="258" font-size="13" fill="#9aa8b5">The heartbeat tag is now KMAC256, and it verifies every cycle.</text>
</g>
</svg>
