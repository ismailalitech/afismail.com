<rect x="0" y="414" width="1100" height="70" fill="#12171d"/>
<circle cx="24" cy="440" r="13" fill="#ffd166"/><text x="24" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="438" font-size="15" font-weight="bold" fill="#e6ecf1">Back</text>
<text x="48" y="458" font-size="13" fill="#9aa8b5">The good file back: admitted with a new session.</text>
</g>
