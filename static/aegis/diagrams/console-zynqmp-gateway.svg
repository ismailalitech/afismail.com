<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">19:44:49 zynqmp-te0808 ADMITTED (software trust)  [credential: valid, heartbeat 3 (uptime_s=124;link=1;fw=linux-0.1.0)]</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">19:45:23 zynqmp-te0808 ADMITTED (software trust)  [credential: valid, heartbeat 4 (uptime_s=158;link=1;fw=linux-0.1.0)]</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">19:45:56 zynqmp-te0808 QUARANTINED (software trust) component KERNEL not allowed (measurement d65da5fa0dc5...) [credential: revoked]</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">19:46:30 zynqmp-te0808 ADMITTED (software trust)  [credential: issued session dc38f54525ee...]</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">19:47:04 zynqmp-te0808 ADMITTED (software trust)  [credential: valid, heartbeat 1 (uptime_s=260;link=1;fw=linux-0.1.0)]</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">ssh &lt;gateway&gt; journalctl -u aegis-fleet -o cat | grep zynqmp-te0808     # OP-TEE, development HUK</tspan></text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">22:22:25 zynqmp-te0808 QUARANTINED no attestation: [Errno 113] No route to host [credential: revoked]</text>
