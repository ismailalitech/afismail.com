<text x="24" y="318" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">22:24:06 zynqmp-te0808 ADMITTED (trustzone-devkey trust)  [credential: valid, heartbeat 2 (requests=7;fw=zynqmp-optee-0.1.0)]</text>
