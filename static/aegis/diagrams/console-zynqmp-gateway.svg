<rect x="0" y="414" width="1100" height="70" fill="#12171d"/>
<circle cx="24" cy="440" r="13" fill="#ffd166"/><text x="24" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="438" font-size="15" font-weight="bold" fill="#e6ecf1">Tamper test</text>
<text x="48" y="458" font-size="13" fill="#9aa8b5">boot.scr with one added line: KERNEL not allowed, credential revoked.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="183" width="1084" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
