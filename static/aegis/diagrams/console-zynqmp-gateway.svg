<text x="550" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">the gateway journal: software trust, trustzone-devkey, trustzone</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">ssh &lt;gateway&gt; journalctl -u aegis-fleet -o cat | grep zynqmp-te0808     # Linux prover, our boot chain</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">19:43:07 zynqmp-te0808 ADMITTED (software trust)  [credential: issued session 744132daf956...]</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">19:43:41 zynqmp-te0808 ADMITTED (software trust)  [credential: valid, heartbeat 1 (uptime_s=57;link=1;fw=linux-0.1.0)]</text>
