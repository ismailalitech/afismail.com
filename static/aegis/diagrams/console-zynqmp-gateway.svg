<text x="48" y="438" font-size="15" font-weight="bold" fill="#e6ecf1">Software trust</text>
<text x="48" y="458" font-size="13" fill="#9aa8b5">The Linux prover: a key in a file, measurements taken by Linux.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="163" width="1084" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
