<circle cx="24" cy="440" r="13" fill="#ffd166"/><text x="24" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="438" font-size="15" font-weight="bold" fill="#e6ecf1">trustzone-devkey</text>
<text x="48" y="458" font-size="13" fill="#9aa8b5">Power-on reset, then the TA answers with OP-TEE's development key.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="343" width="1084" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
