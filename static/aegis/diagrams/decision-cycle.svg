<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">One decision cycle. The gateway sends a fresh challenge. The endpoint returns a TF-M token with an ML-DSA-65 signature. The gateway checks the signature, the challenge and the measurements against its policy. A failure is QUARANTINED with the reason; a pass is ADMITTED, followed by an ML-KEM exchange that gives a credential and a session, with heartbeats until the next cycle.</title><desc id="d">One decision cycle. The gateway sends a fresh challenge. The endpoint returns a TF-M token with an ML-DSA-65 signature. The gateway checks the signature, the challenge and the measurements against its policy. A failure is QUARANTINED with the reason; a pass is ADMITTED, followed by an ML-KEM exchange that gives a credential and a session, with heartbeats until the next cycle.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 21.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 21.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.05%{opacity:1}9.05%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M210,63 L250,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M210,63 L250,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M450,63 L490,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M450,63 L490,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M680,49.8 L700,49.8 L700,38 L720,38" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M680,49.8 L700,49.8 L700,38 L720,38" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M680,82.8 L700,82.8 L700,118 L720,118" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M680,82.8 L700,82.8 L700,118 L720,118" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M585,96 L585,200" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M585,96 L585,200" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="589" y="139" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="594" y="151.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">if admitted</text>
</g>
<g id="e5">
<path d="M490,242 L450,242" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M490,242 L450,242" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e6">
<path d="M250,242 L210,242" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:16.90s" d="M250,242 L210,242" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="c1">
<rect x="20" y="30" width="190" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="115" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 Challenge</text>
<text x="115" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">32 fresh random bytes</text>
<text x="115" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PQCHAL</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c2">
<rect x="250" y="30" width="200" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="350" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">2 Evidence</text>
<text x="350" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">TF-M token (515 bytes)</text>
<text x="350" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">+ ML-DSA-65 signature</text>
<rect class="hl" style="animation-delay:2.60s" x="249" y="29" width="202" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c3">
<rect x="490" y="30" width="190" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="585" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">3 Checks</text>
<text x="585" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signature, challenge,</text>
<text x="585" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">measurements vs policy</text>
<rect class="hl" style="animation-delay:5.20s" x="489" y="29" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ok">
<rect x="720" y="10" width="160" height="56" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="800" y="42.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ADMITTED</text>
<rect class="hl" style="animation-delay:7.80s" x="719" y="9" width="162" height="58" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="bad">
<rect x="720" y="90" width="160" height="56" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="800" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">QUARANTINED</text>
<text x="800" y="131" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">reason logged</text>
<rect class="hl" style="animation-delay:10.40s" x="719" y="89" width="162" height="58" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c4">
<rect x="490" y="200" width="190" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="585" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">4 ML-KEM exchange</text>
<text x="585" y="238" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">credential signed by the</text>
<text x="585" y="255" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">gateway, bound to the</text>
<text x="585" y="272" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ciphertext</text>
<rect class="hl" style="animation-delay:13.00s" x="489" y="199" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c5">
<rect x="250" y="200" width="200" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="350" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">5 Session</text>
<text x="350" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">key held in secure RAM</text>
<text x="350" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">heartbeat every cycle</text>
<rect class="hl" style="animation-delay:15.60s" x="249" y="199" width="202" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="c6">
<rect x="20" y="200" width="190" height="84" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="115" y="229.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">6 Next cycle</text>
<text x="115" y="246.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">30 s later, or a new</text>
<text x="115" y="263.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">session after a reboot</text>
<rect class="hl" style="animation-delay:18.20s" x="19" y="199" width="192" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
