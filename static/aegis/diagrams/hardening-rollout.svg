<rect x="250" y="30" width="190" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="345" y="55.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">1 Gateway code</text>
<text x="345" y="72.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">policy unchanged:</text>
<text x="345" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">old image still ADMITTED</text>
