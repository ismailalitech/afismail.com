</g>
<g id="s0">
<rect x="20" y="30" width="190" height="76" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="115" y="55.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">0 Baseline</text>
<text x="115" y="72.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">regression 12 of 12</text>
<text x="115" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">backup of both slots</text>
