<path class="hl flow" style="animation-delay:14.30s" d="M345,106 L345,188 L235,188 L235,270" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="236.7" y="166" width="106.6" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
