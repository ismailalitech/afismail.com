<text x="575" y="72.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">same key; new measurement</text>
<text x="575" y="89.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">must be QUARANTINED</text>
