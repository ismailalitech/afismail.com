<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img" aria-labelledby="t d">
<title id="t">one transcript on STM32 board 2</title><desc id="d">tests/board/transcript_swap_check.py on the gateway against STM32 board 2. With the transcript image, a bound exchange is accepted; the same quote a second time is refused and the session kept; credentials that do not name this transcript get -149 from the partition. Then the earlier image, which derives the same device key, was flashed after the quote was appraised: continuing the recorded quote is refused before a credential is sent, and so is a new cycle with that image.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="1000" height="364" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="1000" height="294" fill="#0d1117"/>
<rect x="0" y="0" width="1000" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="500" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">one transcript on STM32 board 2</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">transcript_swap_check.py ... live   # STM32 board 2, SPE 3183f74a</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"L1_bound_exchange": "accepted, session 020819f85e40c9fc, bound to quote e0791014f6a7ff50"</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"L2_same_quote_again": "refused: transcript v2 required, but the endpoint answered the unbound exchange ..."</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"L2_session_kept": true</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"L4_credential_without_the_transcript": "ERR pq -149"</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"L4_session_kept": true</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">transcript_swap_check.py ... swap   # after the earlier image 67a452b1 was flashed and the board reset</tspan></text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"S1_recorded_quote_continued": "refused: transcript v2 required, but the endpoint answered the unbound exchange ..."</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"S1_credential_sent": false</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"S2_quote_for_the_recorded_challenge": "another quote (83d43cdc7be1ae06...): this boot does not report what was ...</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">"S3_new_cycle": "refused: transcript v2 required, but the endpoint answered the unbound exchange ..."</text>
<rect x="0" y="294" width="1000" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="984" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="294" width="1000" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Bound</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">The exchange continues the quote just appraised.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="83" width="984" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="294" width="1000" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Same quote twice</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">Refused, and the session is kept.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="123" width="984" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="125" r="11" fill="#ffd166"/><text x="8" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="294" width="1000" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Wrong transcript</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">The partition refuses the credential: -149.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="183" width="984" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="294" width="1000" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Another image</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">It cannot continue the appraised quote; no credential is sent.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="223" width="984" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="225" r="11" fill="#ffd166"/><text x="8" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="294" width="1000" height="70" fill="#12171d"/>
<circle cx="24" cy="320" r="13" fill="#ffd166"/><text x="24" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">No way around</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">Another quote for the same challenge, or a new cycle: refused.</text>
</g>
</svg>
