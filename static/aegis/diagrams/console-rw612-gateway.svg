<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Modified image</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">The key still signs, but APP is not allowed: quarantined, credential revoked.</text>
</g>
