<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Heartbeats</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">KMAC256 over the session, one per cycle.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="123" width="1084" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
