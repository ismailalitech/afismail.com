<text x="48" y="318" font-size="15" font-weight="bold" fill="#e6ecf1">Admitted</text>
<text x="48" y="338" font-size="13" fill="#9aa8b5">Device-key trust; a credential and an ML-KEM-768 session are issued.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="83" width="1084" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
