<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d">
<title id="t">The enforcement path. Traffic from an endpoint reaches the gateway's forward chain, whose policy is drop. It is forwarded to the rest of the network only while the endpoint's address is in the admitted set, in either direction; otherwise it is dropped and logged. After every verdict, aegis-fleet calls the hook that adds the address to the set or removes it, and the gateway keeps attesting the endpoint directly.</title><desc id="d">The enforcement path. Traffic from an endpoint reaches the gateway's forward chain, whose policy is drop. It is forwarded to the rest of the network only while the endpoint's address is in the admitted set, in either direction; otherwise it is dropped and logged. After every verdict, aegis-fleet calls the hook that adds the address to the set or removes it, and the gateway keeps attesting the endpoint directly.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 12.40s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 12.40s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}10.48%{opacity:1}13.48%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="410" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M220,148 L300,148" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M220,148 L300,148" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="232.46" y="126" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="260" y="138.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">traffic</text>
</g>
<g id="e1">
<path d="M600,148 L680,148" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M600,148 L680,148" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="599.58" y="126" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="640" y="138.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">if admitted</text>
</g>
<g id="e2">
<path d="M450,300 L450,216" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:7.80s" d="M450,300 L450,216" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="454" y="249" width="106.6" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="459" y="261.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">set the address</text>
</g>
<g id="e3">
<path d="M300,338 L120,338 L120,186" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M300,338 L120,338 L120,186" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="182.46" y="316" width="55.08" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="210" y="328.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">attests</text>
</g>
<g id="ep">
<rect x="20" y="110" width="200" height="76" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="120" y="135.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Endpoint</text>
<text x="120" y="152.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">attested every cycle</text>
<text x="120" y="169.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">by the gateway</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="109" width="202" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="gw">
<rect x="300" y="80" width="300" height="136" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="118.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Gateway forward chain</text>
<text x="450" y="135.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">policy drop</text>
<text x="450" y="152.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">source in @admitted: accept</text>
<text x="450" y="169.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">destination in @admitted: accept</text>
<text x="450" y="186.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">anything else: drop and log</text>
<rect class="hl" style="animation-delay:2.60s" x="299" y="79" width="302" height="138" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="lan">
<rect x="680" y="110" width="200" height="76" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="780" y="152.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">The rest of the network</text>
<rect class="hl" style="animation-delay:5.20s" x="679" y="109" width="202" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="fleet">
<rect x="300" y="300" width="300" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="325.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegis-fleet</text>
<text x="450" y="342.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">after every verdict calls</text>
<text x="450" y="359.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">aegis-enforce.sh admit | quarantine</text>
<rect class="hl" style="animation-delay:6.50s" x="299" y="299" width="302" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
