<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 324" width="900" height="324" role="img" aria-labelledby="t d">
<title id="t">gateway journal during the demo</title><desc id="d">The gateway journal during the scripted demo: an endpoint that did not answer is quarantined, then admitted with a new session and heartbeats, then quarantined when a modified image runs because its measurement is not allowed, and admitted again with a new session when the good image is back.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="324" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="900" height="254" fill="#0d1117"/>
<rect x="0" y="0" width="900" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="450" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">gateway journal during the demo</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">ssh &lt;gateway&gt; journalctl -u aegis-fleet -o cat      # recorded during tools/demo.sh</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk QUARANTINED no attestation: no PQ quote in reply: '' [credential: revoked]</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk ADMITTED  [credential: issued session 8c25e397e036...]</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk ADMITTED  [credential: valid, heartbeat 1 (uptime_s=137;link=1;fw=0.4.0)]</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk ADMITTED  [credential: valid, heartbeat 2 (uptime_s=168;link=1;fw=0.4.0)]</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk ADMITTED  [credential: valid, heartbeat 3 (uptime_s=198;link=1;fw=0.4.0)]</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk QUARANTINED component NSPE not allowed (measurement b89ee37e2add...) [credential: revoked]</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk ADMITTED  [credential: issued session 9bb455c9acad...]</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk ADMITTED  [credential: valid, heartbeat 1 (uptime_s=53;link=1;fw=0.4.0)]</text>
<rect x="0" y="254" width="900" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="254" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">No quote</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">No post-quantum quote in the reply: quarantined, credential revoked.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="83" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="254" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Admitted, with a session</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">The checks pass; an ML-KEM credential and a session are issued.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="103" width="884" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="105" r="11" fill="#ffd166"/><text x="8" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="254" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Heartbeats</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">Each cycle the endpoint proves it still holds the session; the counter rises.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="163" width="884" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="165" r="11" fill="#ffd166"/><text x="8" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="254" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Modified firmware</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">Signed and booting, but its measurement is not in the policy: quarantined, credential revoked.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="183" width="884" height="43" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="185" r="11" fill="#ffd166"/><text x="8" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="254" width="900" height="70" fill="#12171d"/>
<circle cx="24" cy="280" r="13" fill="#ffd166"/><text x="24" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="278" font-size="15" font-weight="bold" fill="#e6ecf1">Good image back</text>
<text x="48" y="298" font-size="13" fill="#9aa8b5">Admitted again with a different session; the heartbeat counter starts over.</text>
</g>
</svg>
