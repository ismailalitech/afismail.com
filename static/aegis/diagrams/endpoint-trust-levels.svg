<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">Three kinds of endpoint and what their evidence proves. The STM32H573 with TF-M keeps its ML-DSA-65 key in the secure side, derived from the hardware-unique key, and its measurements come from the secure boot loader: the verdict carries no label. The FRDM-RW612 derives its key from the die key inside ELS, so the key proves the chip, but the firmware measures itself: the verdict says device-key trust. A Linux board keeps its key in a file and Linux measures its own files: the verdict says software trust.</title><desc id="d">Three kinds of endpoint and what their evidence proves. The STM32H573 with TF-M keeps its ML-DSA-65 key in the secure side, derived from the hardware-unique key, and its measurements come from the secure boot loader: the verdict carries no label. The FRDM-RW612 derives its key from the die key inside ELS, so the key proves the chip, but the firmware measures itself: the verdict says device-key trust. A Linux board keeps its key in a file and Linux measures its own files: the verdict says software trust.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 17.60s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 17.60s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.39%{opacity:1}10.39%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="380" rx="12" fill="#12171d"/>
<g id="h1">
<rect x="140" y="20" width="240" height="44" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="260" y="46.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">STM32H573 + TF-M (aegis-pq)</text>
<rect class="hl" style="animation-delay:0.00s" x="139" y="19" width="242" height="46" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="h2">
<rect x="400" y="20" width="230" height="44" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="515" y="46.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">FRDM-RW612 (aegis-device)</text>
<rect class="hl" style="animation-delay:5.20s" x="399" y="19" width="232" height="46" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="h3">
<rect x="650" y="20" width="230" height="44" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="765" y="46.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Linux board (aegis-linux)</text>
<rect class="hl" style="animation-delay:10.40s" x="649" y="19" width="232" height="46" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="k1">
<rect x="140" y="90" width="240" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="260" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Secure side</text>
<text x="260" y="136" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">derived from the DHUK</text>
<rect class="hl" style="animation-delay:1.30s" x="139" y="89" width="242" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="k2">
<rect x="400" y="90" width="230" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="515" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Inside ELS</text>
<text x="515" y="136" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">derived from the die key</text>
<rect class="hl" style="animation-delay:6.50s" x="399" y="89" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="k3">
<rect x="650" y="90" width="230" height="66" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="765" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">A file</text>
<text x="765" y="136" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">readable by root</text>
<rect class="hl" style="animation-delay:11.70s" x="649" y="89" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="m1">
<rect x="140" y="180" width="240" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="260" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">The boot loader (BL2)</text>
<text x="260" y="226" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">in the PSA token</text>
<rect class="hl" style="animation-delay:2.60s" x="139" y="179" width="242" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="m2">
<rect x="400" y="180" width="230" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="515" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">The firmware itself</text>
<text x="515" y="226" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">a liar could report the good hash</text>
<rect class="hl" style="animation-delay:7.80s" x="399" y="179" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="m3">
<rect x="650" y="180" width="230" height="66" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="765" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">The running Linux</text>
<text x="765" y="226" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">hashes its own files</text>
<rect class="hl" style="animation-delay:13.00s" x="649" y="179" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="v1">
<rect x="140" y="270" width="240" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="260" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ADMITTED</text>
<text x="260" y="316" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">no label</text>
<rect class="hl" style="animation-delay:3.90s" x="139" y="269" width="242" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="v2">
<rect x="400" y="270" width="230" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="515" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ADMITTED (device-key trust)</text>
<text x="515" y="316" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the key proves the chip</text>
<rect class="hl" style="animation-delay:9.10s" x="399" y="269" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="v3">
<rect x="650" y="270" width="230" height="66" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="765" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ADMITTED (software trust)</text>
<text x="765" y="316" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PC-tested; board pending</text>
<rect class="hl" style="animation-delay:14.30s" x="649" y="269" width="232" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="128" text-anchor="start" font-size="13" fill="#9aa8b5" font-weight="bold">Key held by</text>
<text x="20" y="218" text-anchor="start" font-size="13" fill="#9aa8b5" font-weight="bold">Measured by</text>
<text x="20" y="308" text-anchor="start" font-size="13" fill="#9aa8b5" font-weight="bold">Verdict</text>
</svg>
