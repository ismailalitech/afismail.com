<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
<title id="t">How the endpoint's keys are made. The hardware-unique key, which software cannot read, is used by the SAES peripheral to AES-encrypt a fixed 32-byte label; the result is a seed, wiped after use, for the ML-DSA-65 key that signs quotes. A second secret from the same hardware key, with the gateway's nonce and a counter, seeds a fresh ML-KEM-768 key pair for each exchange, which yields the session key held in secure RAM.</title><desc id="d">How the endpoint's keys are made. The hardware-unique key, which software cannot read, is used by the SAES peripheral to AES-encrypt a fixed 32-byte label; the result is a seed, wiped after use, for the ML-DSA-65 key that signs quotes. A second secret from the same hardware key, with the gateway's nonce and a counter, seeds a fresh ML-KEM-768 key pair for each exchange, which yields the session key held in secure RAM.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.90s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.90s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.88%{opacity:1}9.88%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="330" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M210,159.8 L235,159.8 L235,73 L260,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M210,159.8 L235,159.8 L235,73 L260,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M460,73 L510,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M460,73 L510,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M680,73 L720,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M680,73 L720,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M210,186.2 L235,186.2 L235,263 L260,263" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M210,186.2 L235,186.2 L235,263 L260,263" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M460,263 L510,263" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M460,263 L510,263" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M680,263 L720,263" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M680,263 L720,263" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="dhuk">
<rect x="20" y="140" width="190" height="66" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="115" y="160.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Hardware-unique key</text>
<text x="115" y="177.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">DHUK, not readable</text>
<text x="115" y="194.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">by software</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="139" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="saes">
<rect x="260" y="40" width="200" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="360" y="60.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">SAES, AES-256</text>
<text x="360" y="77.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">encrypts a fixed</text>
<text x="360" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">32-byte label</text>
<rect class="hl" style="animation-delay:2.60s" x="259" y="39" width="202" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="seed">
<rect x="510" y="40" width="170" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="595" y="60.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Seed</text>
<text x="595" y="77.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">wiped after key</text>
<text x="595" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">generation</text>
<rect class="hl" style="animation-delay:5.20s" x="509" y="39" width="172" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dsa">
<rect x="720" y="40" width="160" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="800" y="69" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ML-DSA-65 key</text>
<text x="800" y="86" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signs the quotes</text>
<rect class="hl" style="animation-delay:7.80s" x="719" y="39" width="162" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="root">
<rect x="260" y="230" width="200" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="360" y="250.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Second secret</text>
<text x="360" y="267.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">prov_root, also from</text>
<text x="360" y="284.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the DHUK</text>
<rect class="hl" style="animation-delay:10.40s" x="259" y="229" width="202" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="kem">
<rect x="510" y="230" width="170" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="595" y="250.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ML-KEM-768 pair</text>
<text x="595" y="267.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">fresh per exchange</text>
<text x="595" y="284.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">nonce + counter</text>
<rect class="hl" style="animation-delay:13.00s" x="509" y="229" width="172" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="sess">
<rect x="720" y="230" width="160" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="800" y="250.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Session key</text>
<text x="800" y="267.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">decapsulated, kept in</text>
<text x="800" y="284.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">secure RAM only</text>
<rect class="hl" style="animation-delay:15.60s" x="719" y="229" width="162" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
