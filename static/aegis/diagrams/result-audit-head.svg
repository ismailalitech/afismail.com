<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">The audit log's head in each result, Aegis 1.2. With the audit log on, every attestation result the fleet loop signs names the log's last batch record on disk at that moment: aegis.audit-log, the log's id; aegis.audit-batch, the batch number N; aegis.audit-head, the SHA-256 of that record. The result's own decision is written later, in batch N+1 or after, with the result's hash. tools/verify_audit.py log with --result fails unless batch N is in the log byte for byte, and reports where the result's decision is. A relying party that holds a result therefore holds a head of the log.</title><desc id="d">The audit log's head in each result, Aegis 1.2. With the audit log on, every attestation result the fleet loop signs names the log's last batch record on disk at that moment: aegis.audit-log, the log's id; aegis.audit-batch, the batch number N; aegis.audit-head, the SHA-256 of that record. The result's own decision is written later, in batch N+1 or after, with the result's hash. tools/verify_audit.py log with --result fails unless batch N is in the log byte for byte, and reports where the result's decision is. A relying party that holds a result therefore holds a head of the log.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 13.70s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 13.70s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}9.49%{opacity:1}12.49%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M270,72 L325,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M270,72 L325,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="276.4" y="50" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="297.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">names</text>
</g>
<g id="e1">
<path d="M575,72 L630,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M575,72 L630,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="562.08" y="50" width="80.84" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="602.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">then logged</text>
</g>
<g id="e2">
<path d="M450,114 L450,210" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M450,114 L450,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="454" y="153" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="459" y="165.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">--result</text>
</g>
<g id="e3">
<path d="M575,260 L630,260" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M575,260 L630,260" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="578.18" y="238" width="48.64" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="602.5" y="250.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">report</text>
</g>
<g id="bn">
<rect x="20" y="30" width="250" height="84" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="145" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Batch N, on disk</text>
<text x="145" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the log's last batch record</text>
<text x="145" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">when the result is signed</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="res">
<rect x="325" y="30" width="250" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Attestation result</text>
<text x="450" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">aegis.audit-log, -batch N,</text>
<text x="450" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">-head: SHA-256 of batch N</text>
<rect class="hl" style="animation-delay:2.60s" x="324" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="bn1">
<rect x="630" y="30" width="250" height="84" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="755" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Batch N+1 or later</text>
<text x="755" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the result's own decision,</text>
<text x="755" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">with the result's SHA-256</text>
<rect class="hl" style="animation-delay:5.20s" x="629" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="chk">
<rect x="325" y="210" width="250" height="100" rx="9" fill="#2a3140" stroke="#c9d3dd" stroke-width="1.5"/>
<text x="450" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">verify_audit.py --result</text>
<text x="450" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">batch N in the log byte</text>
<text x="450" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">for byte, or refused;</text>
<text x="450" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">where the decision is</text>
<rect class="hl" style="animation-delay:7.80s" x="324" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="rp">
<rect x="630" y="210" width="250" height="100" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="755" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Relying party</text>
<text x="755" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">holds a head of the log</text>
<text x="755" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">with every result</text>
<text x="755" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">it was given</text>
<rect class="hl" style="animation-delay:10.40s" x="629" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
