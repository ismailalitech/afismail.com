<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 404" width="1060" height="404" role="img" aria-labelledby="t d">
<title id="t">the 3-hour soak on three live boards</title><desc id="d">Lines from the soak runner's event log and the endpoint table of its report. The soak started with three endpoints and a 600 s credential; the regressions at the start, the middle and the end passed; sessions were renewed every five minutes on each board. At 22:20 the runner estimated the STM32's clock at 1.535 s per gateway second and failed it: a false positive of its estimate, which paired two heartbeats across the change to the shorter session. Over the whole run each endpoint had 342 verdict lines, no quarantine and 37 renewals.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
