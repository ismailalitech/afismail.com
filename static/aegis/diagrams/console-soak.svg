<text x="530" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">the 3-hour soak on three live boards</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">grep -E "started|passed|renewed|FAIL" evidence/soak-20261121/events.log   # times CET</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">21:55:38 INFO runner: soak started: 3 h, endpoints stm32h573-dk-2,frdm-rw612,zynqmp-te0808, absent ...</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">22:01:41 INFO regression: start passed (6.0 min)</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">22:10:38 INFO stm32h573-dk-2: session renewed</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">22:10:38 INFO frdm-rw612: session renewed</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">22:10:38 INFO zynqmp-te0808: session renewed</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">22:20:38 FAIL stm32h573-dk-2: endpoint clock at 1.535 s per gateway second (bounds 0.90 to 1.06)</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">23:31:41 INFO regression: middle passed (6.0 min)</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">01:01:41 INFO regression: end passed (6.0 min)</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">grep -A5 "^## Endpoints" evidence/soak-20261121/report.md   # verdicts, quarantined, renewals, ..., clock rate</tspan></text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">stm32h573-dk-2 | 342 | 0 | 37 | 1268 | 1.0557 over 9630 s | 0 | 18872/26624 (first 18872) | 600</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">frdm-rw612 | 342 | 0 | 37 | 7 | 1.0002 over 9073 s | 0 | 19176/32768 (first 19176) | 600</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">zynqmp-te0808 | 342 | 0 | 37 | 7 | 1.0002 over 9083 s | 0 | - | 600</text>
