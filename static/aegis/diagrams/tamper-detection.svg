<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-labelledby="t d">
<title id="t">How modified firmware is caught. An image signed with the trusted development key passes the boot loader's signature check and boots. The boot loader measures it, the token carries the measurement to the gateway, and the gateway finds a hash that its policy does not allow: the endpoint is quarantined and its credential revoked.</title><desc id="d">How modified firmware is caught. An image signed with the trusted development key passes the boot loader's signature check and boots. The boot loader measures it, the token carries the measurement to the gateway, and the gateway finds a hash that its policy does not allow: the endpoint is quarantined and its credential revoked.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="290" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M210,73 L250,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M210,73 L250,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M440,73 L480,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M440,73 L480,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M670,73 L710,73" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M670,73 L710,73" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M795,106 L795,213 L670,213" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M795,106 L795,213 L670,213" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M480,213 L440,213" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M480,213 L440,213" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="t1">
<rect x="20" y="40" width="190" height="66" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="115" y="60.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Modified image</text>
<text x="115" y="77.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signed with the trusted</text>
<text x="115" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">development key</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t2">
<rect x="250" y="40" width="190" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="345" y="60.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">BL2 verifies</text>
<text x="345" y="77.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signature valid,</text>
<text x="345" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the image boots</text>
<rect class="hl" style="animation-delay:2.60s" x="249" y="39" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t3">
<rect x="480" y="40" width="190" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="575" y="60.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">BL2 measures</text>
<text x="575" y="77.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SHA-256 of the image,</text>
<text x="575" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signer id</text>
<rect class="hl" style="animation-delay:5.20s" x="479" y="39" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t4">
<rect x="710" y="40" width="170" height="66" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="795" y="60.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Token</text>
<text x="795" y="77.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">carries the</text>
<text x="795" y="94.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">measurement</text>
<rect class="hl" style="animation-delay:7.80s" x="709" y="39" width="172" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t5">
<rect x="480" y="180" width="190" height="66" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="575" y="200.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Gateway policy</text>
<text x="575" y="217.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the allowed hash is</text>
<text x="575" y="234.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">different</text>
<rect class="hl" style="animation-delay:10.40s" x="479" y="179" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="t6">
<rect x="250" y="180" width="190" height="66" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="345" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">QUARANTINED</text>
<text x="345" y="226" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">credential revoked</text>
<rect class="hl" style="animation-delay:13.00s" x="249" y="179" width="192" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
