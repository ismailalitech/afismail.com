<text x="600" y="295.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">TRNG</text>
<text x="600" y="312.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">32 fresh bytes in</text>
<text x="600" y="329.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">every signature</text>
<rect class="hl" style="animation-delay:11.70s" x="519" y="269" width="162" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="flash">
<rect x="720" y="270" width="160" height="76" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="800" y="295.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Flash (XIP)</text>
<text x="800" y="312.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the running image:</text>
<text x="800" y="329.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">APP = SHA-256</text>
<rect class="hl" style="animation-delay:14.30s" x="719" y="269" width="162" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="290" y="395" text-anchor="start" font-size="12" fill="#9aa8b5">FRDM-RW612: Cortex-M33 at 260 MHz, Zephyr v4.5.0, prover 0.1.0 (146 kB)</text>
</svg>
