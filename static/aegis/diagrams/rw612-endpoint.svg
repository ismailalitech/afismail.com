</g>
<g id="gw">
<rect x="20" y="40" width="200" height="92" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="120" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Gateway: aegis-fleet</text>
<text x="120" y="82" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">kind aegis-device</text>
<text x="120" y="99" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">pinned ML-DSA-65 key</text>
<text x="120" y="116" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">allowed APP hash</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="39" width="202" height="94" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="cred">
<rect x="20" y="250" width="200" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="120" y="275.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Gateway identity</text>
<text x="120" y="292.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signs the credential</text>
<text x="120" y="309.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(ML-DSA-65)</text>
<rect class="hl" style="animation-delay:16.90s" x="19" y="249" width="202" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="net">
<rect x="290" y="40" width="170" height="92" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="375" y="73.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Zephyr networking</text>
<text x="375" y="90.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ENET, KSZ8081 PHY</text>
<text x="375" y="107.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">DHCP, TCP port 7444</text>
