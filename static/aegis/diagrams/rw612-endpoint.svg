</g>
<g id="proto">
<rect x="520" y="40" width="360" height="92" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="700" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">aegis_proto.c (no RTOS code)</text>
<text x="700" y="82" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">claims, hedged quote, ML-KEM exchange,</text>
<text x="700" y="99" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">credential check, KMAC256 heartbeat;</text>
<text x="700" y="116" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the PC tests build the same file</text>
<rect class="hl" style="animation-delay:5.20s" x="519" y="39" width="362" height="94" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="lib">
<rect x="520" y="170" width="360" height="60" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="700" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">mldsa-native, mlkem-native v2.0.0, KMAC256</text>
<text x="700" y="213" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the same code and configuration as the STM32 partition</text>
<rect class="hl" style="animation-delay:7.80s" x="519" y="169" width="362" height="62" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="els">
<rect x="290" y="270" width="170" height="76" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="375" y="295.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ELS</text>
<text x="375" y="312.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">die key, CKDF, HMAC</text>
<text x="375" y="329.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">(aegis_els.c)</text>
<rect class="hl" style="animation-delay:9.10s" x="289" y="269" width="172" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
