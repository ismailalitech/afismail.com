<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d">
<title id="t">The RW612 endpoint and the gateway. The gateway's fleet service pins the board's ML-DSA-65 key and allows one image hash; it reaches the board over Ethernet on TCP port 7444. On the board, Zephyr runs the Ethernet driver with DHCP and a small TCP server; the protocol code (aegis_proto.c, with no RTOS code, so the PC tests build the same file) builds the claims, signs them, runs the ML-KEM exchange and the KMAC heartbeat with mldsa-native, mlkem-native and the KMAC code shared with the STM32 endpoint. Under it: ELS derives the keys from the die key, the TRNG gives 32 fresh bytes to every signature, and the image in flash is hashed for the APP measurement.</title><desc id="d">The RW612 endpoint and the gateway. The gateway's fleet service pins the board's ML-DSA-65 key and allows one image hash; it reaches the board over Ethernet on TCP port 7444. On the board, Zephyr runs the Ethernet driver with DHCP and a small TCP server; the protocol code (aegis_proto.c, with no RTOS code, so the PC tests build the same file) builds the claims, signs them, runs the ML-KEM exchange and the KMAC heartbeat with mldsa-native, mlkem-native and the KMAC code shared with the STM32 endpoint. Under it: ELS derives the keys from the die key, the TRNG gives 32 fresh bytes to every signature, and the image in flash is hashed for the APP measurement.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 21.50s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 21.50s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.05%{opacity:1}9.05%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
