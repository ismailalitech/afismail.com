<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
<title id="t">How the RW612 endpoint's keys are made, inside the chip's EdgeLock Secure Subsystem (ELS). The die master key, loaded by the boot ROM from the PUF into ELS slots 0 and 1 and never readable by software, derives a temporary HMAC key with CKDF (NIST SP 800-108) into slots 18 and 19. ELS computes two HMAC-SHA256 values with it, one per label, and the temporary key is deleted. The first value seeds the ML-DSA-65 key that signs quotes (and gives the MAC address), the second is the provisioning root from which each ML-KEM-768 exchange draws a fresh key pair and the session key.</title><desc id="d">How the RW612 endpoint's keys are made, inside the chip's EdgeLock Secure Subsystem (ELS). The die master key, loaded by the boot ROM from the PUF into ELS slots 0 and 1 and never readable by software, derives a temporary HMAC key with CKDF (NIST SP 800-108) into slots 18 and 19. ELS computes two HMAC-SHA256 values with it, one per label, and the temporary key is deleted. The first value seeds the ML-DSA-65 key that signs quotes (and gives the MAC address), the second is the provisioning root from which each ML-KEM-768 exchange draws a fresh key pair and the session key.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 18.90s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 18.90s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}6.88%{opacity:1}9.88%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="360" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M180,178 L210,178" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M180,178 L210,178" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e1">
<path d="M360,178 L390,178" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M360,178 L390,178" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e2">
<path d="M540,162.8 L556,162.8 L556,63 L572,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M540,162.8 L556,162.8 L556,63 L572,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M540,193.2 L556,193.2 L556,283 L572,283" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M540,193.2 L556,193.2 L556,283 L572,283" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M728,63 L750,63" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M728,63 L750,63" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e5">
<path d="M728,283 L750,283" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:14.30s" d="M728,283 L750,283" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="die">
<rect x="20" y="140" width="160" height="76" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="100" y="165.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Die master key</text>
<text x="100" y="182.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ELS slots 0-1, from the</text>
<text x="100" y="199.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">PUF; never readable</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="139" width="162" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ckdf">
<rect x="210" y="140" width="150" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="285" y="165.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">CKDF in ELS</text>
<text x="285" y="182.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">SP 800-108, data</text>
<text x="285" y="199.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">AEGIS-RW612 1</text>
<rect class="hl" style="animation-delay:2.60s" x="209" y="139" width="152" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="tmp">
<rect x="390" y="140" width="150" height="76" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="465" y="165.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Temporary key</text>
<text x="465" y="182.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">slots 18-19, HMAC</text>
<text x="465" y="199.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">only; then deleted</text>
<rect class="hl" style="animation-delay:5.20s" x="389" y="139" width="152" height="78" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="seed">
<rect x="572" y="30" width="156" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="650" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Seed</text>
<text x="650" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">HMAC, label 1</text>
<text x="650" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">wiped after keygen</text>
<rect class="hl" style="animation-delay:7.80s" x="571" y="29" width="158" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dsa">
<rect x="750" y="30" width="130" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="815" y="50.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ML-DSA-65</text>
<text x="815" y="67.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">signs quotes;</text>
<text x="815" y="84.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">MAC 02:ae + pk</text>
<rect class="hl" style="animation-delay:10.40s" x="749" y="29" width="132" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="root">
<rect x="572" y="250" width="156" height="66" rx="9" fill="#1e2530" stroke="#6b7b8c" stroke-width="1.5"/>
<text x="650" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Provisioning root</text>
<text x="650" y="296" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">HMAC, label 2</text>
<rect class="hl" style="animation-delay:13.00s" x="571" y="249" width="158" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="kem">
<rect x="750" y="250" width="130" height="66" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="815" y="270.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">ML-KEM-768</text>
<text x="815" y="287.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">per exchange,</text>
<text x="815" y="304.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">then the session</text>
<rect class="hl" style="animation-delay:15.60s" x="749" y="249" width="132" height="68" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<text x="20" y="262" text-anchor="start" font-size="12" fill="#c0a95f">inside ELS: software sees only</text>
<text x="20" y="279" text-anchor="start" font-size="12" fill="#c0a95f">the two 32-byte HMAC outputs</text>
</svg>
