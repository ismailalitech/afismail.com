<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">A trust floor and a switch, Aegis 1.2. A policy entry can say min_trust, or inherit the policy's top-level one, and disabled. When the policy loads, possible_trust works out the labels the entry's kind, profile and attestation key can ever give. If none meets the floor, the entry is refused by the policy rules, not contacted, its result incomplete, and fleet.py check exits 1. If a label can meet it, the endpoint is contacted and appraised and the label of that cycle's quote is checked again; a verdict that meets the floor is admitted as before and its result says aegis.min-trust. An entry with disabled set to true is not contacted, is quarantined every cycle with disabled by policy, its session revoked, its result incomplete.</title><desc id="d">A trust floor and a switch, Aegis 1.2. A policy entry can say min_trust, or inherit the policy's top-level one, and disabled. When the policy loads, possible_trust works out the labels the entry's kind, profile and attestation key can ever give. If none meets the floor, the entry is refused by the policy rules, not contacted, its result incomplete, and fleet.py check exits 1. If a label can meet it, the endpoint is contacted and appraised and the label of that cycle's quote is checked again; a verdict that meets the floor is admitted as before and its result says aegis.min-trust. An entry with disabled set to true is not contacted, is quarantined every cycle with disabled by policy, its session revoked, its result incomplete.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 16.30s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 16.30s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}7.98%{opacity:1}10.98%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#12171d"/>
<g id="e0">
<path d="M270,72 L325,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:1.30s" d="M270,72 L325,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="276.4" y="50" width="42.2" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="297.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">loads</text>
</g>
<g id="e1">
<path d="M575,72 L630,72" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:3.90s" d="M575,72 L630,72" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="571.74" y="50" width="61.52" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="602.5" y="62.5" text-anchor="middle" font-size="11.5" fill="#e6ecf1">can meet</text>
</g>
<g id="e2">
<path d="M755,114 L755,210" fill="none" stroke="#7d8c9b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-plain)"/>
<path class="hl flow" style="animation-delay:6.50s" d="M755,114 L755,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e3">
<path d="M145,114 L145,210" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
<path class="hl flow" style="animation-delay:9.10s" d="M145,114 L145,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
</g>
<g id="e4">
<path d="M450,114 L450,210" fill="none" stroke="#ef6f6c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#ar-bad)"/>
<path class="hl flow" style="animation-delay:11.70s" d="M450,114 L450,210" fill="none" stroke="#ffd166" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#ar-hl)"/>
<rect x="454" y="153" width="119.48" height="17" rx="4" fill="#12171d" fill-opacity="0.85"/>
<text x="459" y="165.5" text-anchor="start" font-size="11.5" fill="#e6ecf1">no label meets it</text>
</g>
<g id="pol">
<rect x="20" y="30" width="250" height="84" rx="9" fill="#352f1c" stroke="#c0a95f" stroke-width="1.5"/>
<text x="145" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Policy entry</text>
<text x="145" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">min_trust: its own,</text>
<text x="145" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">or the policy's top level;</text>
<text x="145" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">disabled</text>
<rect class="hl" style="animation-delay:0.00s" x="19" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="pos">
<rect x="325" y="30" width="250" height="84" rx="9" fill="#1b3047" stroke="#5aa0d6" stroke-width="1.5"/>
<text x="450" y="51" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">possible_trust</text>
<text x="450" y="68" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the labels its kind, profile</text>
<text x="450" y="85" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">and attestation key can</text>
<text x="450" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">ever give, at load time</text>
<rect class="hl" style="animation-delay:2.60s" x="324" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="ask">
<rect x="630" y="30" width="250" height="84" rx="9" fill="#2f2447" stroke="#b08fe0" stroke-width="1.5"/>
<text x="755" y="59.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Contacted, appraised</text>
<text x="755" y="76.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">the label of this cycle's</text>
<text x="755" y="93.5" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">quote checked again</text>
<rect class="hl" style="animation-delay:5.20s" x="629" y="29" width="252" height="86" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="dis">
<rect x="20" y="210" width="250" height="100" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="145" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">disabled: true</text>
<text x="145" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">not contacted, QUARANTINED,</text>
<text x="145" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">session revoked,</text>
<text x="145" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">result incomplete</text>
<rect class="hl" style="animation-delay:10.40s" x="19" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="never">
<rect x="325" y="210" width="250" height="100" rx="9" fill="#43201f" stroke="#ef6f6c" stroke-width="1.5"/>
<text x="450" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Can NEVER meet the floor</text>
<text x="450" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">refused as the policy's</text>
<text x="450" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">mistake, not contacted,</text>
<text x="450" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">result incomplete</text>
<rect class="hl" style="animation-delay:13.00s" x="324" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
<g id="met">
<rect x="630" y="210" width="250" height="100" rx="9" fill="#17382f" stroke="#4fd1a5" stroke-width="1.5"/>
<text x="755" y="239" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6ecf1">Floor met</text>
<text x="755" y="256" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">admitted as before,</text>
<text x="755" y="273" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">aegis.min-trust</text>
<text x="755" y="290" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#9aa8b5">in the result</text>
<rect class="hl" style="animation-delay:7.80s" x="629" y="209" width="252" height="102" rx="9" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-width="3"/>
</g>
</svg>
