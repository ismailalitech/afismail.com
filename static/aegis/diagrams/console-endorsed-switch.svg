<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 424" width="1140" height="424" role="img" aria-labelledby="t d">
<title id="t">endorsement required: a substituted key and a missing record</title><desc id="d">The gateway journal when its policy began to require an endorsement for the two STM32s and the RW612. The endorser on the bench PC, whose key is sealed to the PC's TPM, had endorsed each device in under a second. All three are admitted, endorsed by bench-pc. Board 2's pinned key replaced by board 1's: quarantined, substituted key. The key restored but the record removed: quarantined, no endorsement record. The record back: admitted. The full board regression passed 14 of 14 afterwards.</desc>
<style>
text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.hl,.co{opacity:0;animation:lit 19.00s linear infinite;animation-fill-mode:forwards}
.flow{stroke-dasharray:9 6;animation:lit 19.00s linear infinite,flow .7s linear infinite;animation-fill-mode:forwards}
@keyframes lit{0%{opacity:0}2%{opacity:1}17.89%{opacity:1}20.89%{opacity:0}100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-15}}
.play{animation-name:slide;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@media (prefers-reduced-motion:reduce){.hl,.play{animation:none}.play{display:none}.co{animation:none;opacity:1}.cap{display:none}}
</style>
<defs><marker id="ar-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8c9b"/></marker><marker id="ar-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3dd"/></marker><marker id="ar-hart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0d6"/></marker><marker id="ar-mss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8da6d4"/></marker><marker id="ar-fabric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fbf84"/></marker><marker id="ar-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0a95f"/></marker><marker id="ar-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08fe0"/></marker><marker id="ar-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd1a5"/></marker><marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6f6c"/></marker><marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
<rect width="1140" height="424" rx="12" fill="#12171d"/>
<rect x="0" y="0" width="1140" height="354" fill="#0d1117"/>
<rect x="0" y="0" width="1140" height="34" fill="#1b222c"/>
<circle cx="20" cy="17" r="6" fill="#ef6f6c"/>
<circle cx="38" cy="17" r="6" fill="#e6c04f"/>
<circle cx="56" cy="17" r="6" fill="#5fbf84"/>
<text x="570" y="22" text-anchor="middle" font-size="12" fill="#9aa8b5">endorsement required: a substituted key and a missing record</text>
<text x="24" y="58" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#5fbf84">$ </tspan><tspan fill="#e6ecf1">journalctl -u aegis-fleet -o cat   # 20 November 2026, with the operator's notes</tspan></text>
<text x="24" y="78" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  # endorse: 0.566 s, 0.691 s, 0.194 s per device; enroll-endorsed: the three keys equal the keys already pinned.</text>
<text x="24" y="98" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">12:22:44 frdm-rw612 ADMITTED (trustzone trust) [credential: valid, heartbeat 79 (...;fw=rw612-tfm-0.3.2;...)] [endorsed by bench-pc]</text>
<text x="24" y="118" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">12:23:19 stm32h573-dk ADMITTED [credential: valid, heartbeat 92 (...;sstack=18872/26624;...)] [endorsed by bench-pc]</text>
<text x="24" y="138" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">12:23:19 stm32h573-dk-2 ADMITTED [credential: valid, heartbeat 95 (...;sstack=18872/26624;...)] [endorsed by bench-pc]</text>
<text x="24" y="158" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  # live: board 2's pinned key replaced by board 1's</text>
<text x="24" y="178" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">12:24:26 stm32h573-dk-2 QUARANTINED endorsement required: the pinned key (sha256 29b953e6571dbd36...) is not the endorsed key</text>
<text x="24" y="198" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">         (c9e2aa6e8157ac94...): substituted key [credential: revoked]</text>
<text x="24" y="218" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  # key restored, board 2's record removed</text>
<text x="24" y="238" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">12:25:34 stm32h573-dk-2 QUARANTINED endorsement required: no endorsement record (.../policy/endorsements/stm32h573-dk-2.json)</text>
<text x="24" y="258" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">         [credential: revoked]</text>
<text x="24" y="278" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  # record restored</text>
<text x="24" y="298" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">12:27:17 stm32h573-dk-2 ADMITTED [credential: valid, heartbeat 96 (...)] [endorsed by bench-pc]</text>
<text x="24" y="318" font-family="IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b9c4cf" xml:space="preserve">  # full board regression afterwards: passed 14, failed 0 (logs/regression/20261120-132726)</text>
<rect x="0" y="354" width="1140" height="70" fill="#12171d"/>
<g class="co" style="animation-delay:0.00s"><rect x="8" y="63" width="1124" height="23" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="65" r="11" fill="#ffd166"/><text x="8" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">1</text></g>
<g class="co cap" style="animation-delay:0.00s">
<rect x="0" y="354" width="1140" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">1</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">Endorsed at the bench</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">Well under a second per device; the keys are the ones already pinned.</text>
</g>
<g class="co" style="animation-delay:3.40s"><rect x="8" y="83" width="1124" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="85" r="11" fill="#ffd166"/><text x="8" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">2</text></g>
<g class="co cap" style="animation-delay:3.40s">
<rect x="0" y="354" width="1140" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">2</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">Required</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">All three admitted, endorsed by bench-pc.</text>
</g>
<g class="co" style="animation-delay:6.80s"><rect x="8" y="143" width="1124" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="145" r="11" fill="#ffd166"/><text x="8" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">3</text></g>
<g class="co cap" style="animation-delay:6.80s">
<rect x="0" y="354" width="1140" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">3</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">Substituted key</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">Board 1's key under board 2's name: quarantined, credential revoked.</text>
</g>
<g class="co" style="animation-delay:10.20s"><rect x="8" y="203" width="1124" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="205" r="11" fill="#ffd166"/><text x="8" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">4</text></g>
<g class="co cap" style="animation-delay:10.20s">
<rect x="0" y="354" width="1140" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">4</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">No record</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">Quarantined until the record is back.</text>
</g>
<g class="co" style="animation-delay:13.60s"><rect x="8" y="263" width="1124" height="63" rx="4" fill="#ffd166" fill-opacity="0.13" stroke="#ffd166" stroke-width="2.5"/>
<circle cx="8" cy="265" r="11" fill="#ffd166"/><text x="8" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#12171d">5</text></g>
<g class="co cap" style="animation-delay:13.60s">
<rect x="0" y="354" width="1140" height="70" fill="#12171d"/>
<circle cx="24" cy="380" r="13" fill="#ffd166"/><text x="24" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#12171d">5</text>
<text x="48" y="378" font-size="15" font-weight="bold" fill="#e6ecf1">Back</text>
<text x="48" y="398" font-size="13" fill="#9aa8b5">Admitted; the regression passes 14 of 14.</text>
</g>
