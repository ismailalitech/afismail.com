{{/* Search box of the Search page.
     Receives (dict "id" uniqueID "live" true); "live" marks the box that search.js listens to. */}}
{{ with site.GetPage "/search" }}
<form class="search-form" action="{{ .RelPermalink }}" method="get" role="search"{{ if $.live }} data-search-form{{ end }}>
  <label class="visually-hidden" for="{{ $.id }}">Search the site</label>
  <input id="{{ $.id }}" name="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search the site">
  <button class="btn" type="submit">Search</button>
</form>
{{ end }}
