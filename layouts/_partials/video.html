{{/* A video. Receives (dict "id" youtubeID "title" pageTitle).
     The page shows a play button; the YouTube player loads only when it is pressed.
     Without JavaScript the button opens the video on YouTube. */}}
<div class="video" data-video="{{ .id }}" data-video-title="{{ .title }}">
  <a class="video-link" href="https://www.youtube.com/watch?v={{ .id }}">
    <span class="video-play"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg></span>
    <span class="video-label">Play the video</span>
    <span class="video-note">The player loads from YouTube when you press play.</span>
  </a>
</div>
