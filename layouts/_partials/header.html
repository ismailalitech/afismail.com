{{ $current := . }}
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav class="tabs" aria-label="Main">
      <ul>
        {{ range site.Menus.main }}
          {{ $active := false }}
          {{ with .Page }}
            {{ if or (eq $current .) ($current.IsDescendant .) }}
              {{ $active = true }}
            {{ end }}
          {{ end }}
          <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
      <svg aria-hidden="true" viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.75a7.25 7.25 0 0 0 0 14.5z" fill="currentColor"/></svg>
      <span class="visually-hidden">Dark theme</span>
    </button>
  </div>
</header>
