{{/* Contact block. Shown on the home page and on pages with "contact = true" in their front matter. */}}
{{ with site.Params.email }}
<section class="contact" aria-labelledby="contact-heading">
  <h2 id="contact-heading">Contact</h2>
  <p>For questions or to get in touch, write to <a href="mailto:{{ . }}">{{ . }}</a>.</p>
</section>
{{ end }}
