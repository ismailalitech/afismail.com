{{/* Optional photo or capture on the right of the home page, shown when hero_image is set
     in content/_index.md. Without one the hero is text only, over the board background. */}}
{{ with .Params.hero_image }}
<figure class="hero-figure">
  <img src="{{ . | relURL }}" alt="{{ $.Params.hero_image_alt }}"{{ with $.Params.hero_image_size }} width="{{ index . 0 }}" height="{{ index . 1 }}"{{ end }} fetchpriority="high">
  {{ with $.Params.hero_image_caption }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
{{ end }}
