{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Params.status }}<p><span class="pill">{{ . }}</span></p>{{ end }}
  {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
</header>

<section class="block" aria-labelledby="list-heading">
  <h2 id="list-heading" class="visually-hidden">All {{ .Title | lower }}</h2>
  {{ partial "entry-list.html" (dict "pages" .RegularPages "section" .) }}
</section>
{{ end }}
