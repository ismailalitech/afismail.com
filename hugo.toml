# Site configuration.
baseURL = "https://afismail.com/"
title = "Ali Ismail"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  role = "Embedded systems and security engineer"
  description = "Hands-on embedded systems and security: microcontrollers, RTOS, FPGA, secure C and C++, verification and hardware security."
  # Contact address shown on the home page, the About page and the footer. Leave empty to hide it.
  email = "ismail.ali.tech@gmail.com"
  # Full profile URLs. Leave empty to hide the link in the footer.
  github = "https://github.com/ismailalitech"
  linkedin = "https://www.linkedin.com/in/ali-ismail-4132a7230/"
  # true loads IBM Plex from Google Fonts. false uses system fonts and makes no third-party request.
  googleFonts = true
  # Address of your email sign-up page (from a newsletter service). Leave empty to hide the sign-up block.
  subscribe_url = ""

  # Credentials shown under the headline on the home page. Add, remove or reorder freely.
  [[params.highlights]]
    label = "Engineering degree, embedded security and verification"
    value = "Grenoble INP – ESISAR"
  [[params.highlights]]
    label = "Works across"
    value = "Firmware, FPGA and SoC"
  [[params.highlights]]
    label = "Working languages"
    value = "English, French, Arabic"

# The tabs in the header, in order. Add or remove entries here.
[menus]
  [[menus.main]]
    name = "Labs"
    pageRef = "/labs"
    weight = 10
  [[menus.main]]
    name = "Resources"
    pageRef = "/resources"
    weight = 15
  [[menus.main]]
    name = "Courses"
    pageRef = "/courses"
    weight = 20
  [[menus.main]]
    name = "Consulting"
    pageRef = "/consulting"
    weight = 30
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40

[markup.highlight]
  noClasses = true
  style = "github-dark"

# The "On this page" list on lab pages uses the ## and ### headings.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
