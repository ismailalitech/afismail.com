# Site configuration.
baseURL = "https://afismail.com/"
title = "Ali Ismail"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  role = "Embedded systems and security engineer"
  description = "Embedded systems and security engineer: firmware and RTOS, FPGA/SoC integration, embedded security. Freelance engineering, tools and technical notes."
  # Contact address shown on the home page, the About page and the footer. Leave empty to hide it.
  email = "ismail.ali.tech@gmail.com"
  # Full profile URLs. Leave empty to hide the link in the footer.
  github = "https://github.com/ismailalitech"
  linkedin = "https://www.linkedin.com/in/ali-ismail-4132a7230/"
  # Full address of your YouTube channel. Shows a button on the home page and a footer link.
  youtube = ""
  # The fonts (Instrument Sans, IBM Plex Mono) are served from this site, so no third-party request is made.
  # true loads them from Google Fonts instead.
  googleFonts = false
  # Address of your email sign-up page (from a newsletter service). Leave empty to hide the sign-up block.
  subscribe_url = ""
  # Visitor statistics with Cloudflare Web Analytics (no cookies). This is the site token from the
  # Cloudflare dashboard; it is public, not a password. Leave empty to turn the statistics off.
  cloudflareAnalyticsToken = "9b703e6566b64746a344ea4f0f59ab69"

  # Background shown beside the headline on the home page and on the About page.
  # Each group has a label and a list of items, shown one under the other.
  # An item can have a second, smaller line: note = "...".
  [[params.highlights]]
    label = "Academic background"
    items = [
      { value = "Engineering degree in embedded security and verification", note = "Grenoble INP – ESISAR" },
      { value = "Engineering degree in electronics and telecommunications", note = "Lebanese University" },
    ]
  [[params.highlights]]
    label = "Works across"
    items = [
      { value = "Firmware" },
      { value = "FPGA" },
      { value = "SoC" },
    ]
  [[params.highlights]]
    label = "Working languages"
    items = [
      { value = "English" },
      { value = "French" },
      { value = "Arabic" },
      { value = "Italian" },
    ]

# The tabs in the header, in order. Add or remove entries here.
  # Smooth scrolling with the Lenis library (MIT licence). When the site is built, Hugo downloads
  # the file below once, checks it against the fingerprint, and serves it from your own site.
  # Set enabled = false to turn smooth scrolling off. To move to a newer version, change the
  # version in the address and replace the fingerprint with the one for that file.
  [params.smoothScroll]
    enabled = true
    url = "https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"
    integrity = "sha256-gPU+d/HBPjefwkbSteKZGI4gvLKy/n67E+jox1Y6bac="

  # The animation libraries. Hugo downloads each file once when the site is built, checks it against
  # the fingerprint below, and serves it from your own site, as for Lenis above. A file that does not
  # match is left out and the page works without it. To move to a newer version, change the address
  # and replace the fingerprint with the one printed by:  openssl dgst -sha256 -binary FILE | openssl base64 -A
  # GSAP (3.14.0, free under the GSAP standard licence) with its ScrollTrigger and SplitText plugins.
  [params.libs.gsap]
    url = "https://unpkg.com/gsap@3.14.0/dist/gsap.min.js"
    integrity = "sha256-azqKgeuirJUsbipwrmVeibkSx4PVleSa3Azz50l/ul8="
  [params.libs.scrolltrigger]
    url = "https://unpkg.com/gsap@3.14.0/dist/ScrollTrigger.min.js"
    integrity = "sha256-SfIYaMTiy5/s4gL3ZdeH9jld2gehrxIO+0rkWhtGG1c="
  [params.libs.splittext]
    url = "https://unpkg.com/gsap@3.14.0/dist/SplitText.min.js"
    integrity = "sha256-77FSc7lclmesPUEcHV+I5SRaidTkCfzJRFDRH5sFGVE="
  # React 18 (MIT), used by the React Bits components. Loaded only on pages that have one.
  [params.libs.react]
    url = "https://unpkg.com/react@18.3.1/umd/react.production.min.js"
    integrity = "sha256-2Unxw2h67a3O2shSYYZfKbF80nOZfn9rK/xTsvnUxN0="
  [params.libs.reactdom]
    url = "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
    integrity = "sha256-NfT5dPSyvNRNpzljNH+JUuNB+DkJ5EmCJ9Tia5j2bw0="

